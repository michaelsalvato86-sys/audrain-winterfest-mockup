<style>
/* Layout: a night-palace winter village - midnight base, aurora and ice accents, frosted crystal cards, a floating frosted pill nav. Deliberately single-theme (dark) with every colour set explicitly. */
:root{
  --mid:#0B1E3F; --mid2:#11284F; --mid3:#173563; --snow:#F4FAFD; --muted:#B9C8DE; --edge:rgba(168,216,234,.22);
  --frost:#A8D8EA; --mint:#5EE6C8; --lilac:#C9B8F0; --gold:#D8C27A; --rose:#F2B8C6; --ice:#2A6F97;
  --display:"Cinzel", "Trajan Pro", Georgia, serif; --body:"Nunito Sans", system-ui, -apple-system, "Segoe UI", sans-serif;
  color-scheme:dark;
}
*{box-sizing:border-box} html,body{min-height:100%}
body{background:var(--mid);background-image:radial-gradient(120% 60% at 80% -10%,rgba(94,230,200,.16),transparent 60%),radial-gradient(90% 50% at 0% 0%,rgba(201,184,240,.16),transparent 60%);background-attachment:fixed;color:var(--snow);font-family:var(--body);font-size:16px;line-height:1.5;margin:0}
.app{max-width:520px;margin:0 auto;min-height:100%;display:flex;flex-direction:column}
button,input,select{font:inherit;color:inherit} button{cursor:pointer} a{color:var(--frost)}
:focus-visible{outline:3px solid var(--mint);outline-offset:2px}
.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:5;padding:12px 16px;display:flex;justify-content:space-between;align-items:center;gap:10px;background:rgba(11,30,63,.82);backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px);border-bottom:1px solid var(--edge)}
.brand{font-family:var(--display);font-weight:700;font-size:21px;letter-spacing:.14em;color:var(--snow)}
.brand small{display:block;font-family:var(--body);font-size:10.5px;font-weight:800;letter-spacing:.32em;color:var(--mint)}
.tools{display:flex;gap:8px}
.ib{position:relative;width:40px;height:40px;border-radius:50%;border:1px solid var(--edge);background:var(--mid2);display:grid;place-items:center;color:var(--snow);font-weight:800;font-size:13px}
.ib svg{width:19px;height:19px}
.dot{position:absolute;top:-2px;right:-2px;min-width:16px;height:16px;border-radius:999px;background:var(--mint);color:var(--mid);font-size:10px;font-weight:800;display:grid;place-items:center;padding:0 4px}
main{flex:1;padding:14px 16px calc(120px + env(safe-area-inset-bottom,0px));display:flex;flex-direction:column;gap:16px}
h1,h2,h3{font-family:var(--display);font-weight:700;margin:0;letter-spacing:.06em;text-wrap:balance;color:var(--snow)}
h1{font-size:32px;line-height:1.1} h2{font-size:19px} h3{font-size:15px}
.muted{color:var(--muted);font-size:14.5px;margin:0}
.glass{background:rgba(17,40,79,.78);border:1px solid var(--edge);border-radius:22px;padding:16px;display:flex;flex-direction:column;gap:8px}
.hero{position:relative;overflow:hidden;border-radius:26px;padding:28px 20px 20px;min-height:280px;display:flex;flex-direction:column;justify-content:flex-end;gap:10px;border:1px solid var(--edge);
  background:linear-gradient(160deg,#173563 0%,#0f2a55 40%,#0B1E3F 100%)}
.hero::before{content:"";position:absolute;inset:-20%;background:conic-gradient(from 200deg at 70% 10%,rgba(94,230,200,.35),rgba(201,184,240,.35),rgba(168,216,234,.15),transparent 60%);filter:blur(30px);animation:drift 14s ease-in-out infinite alternate}
@keyframes drift{to{transform:translateX(-8%) rotate(6deg)}}
.hero canvas{position:absolute;inset:0;width:100%;height:100%;pointer-events:none}
.hero > *:not(canvas){position:relative}
.eyebrow{font-size:11px;font-weight:800;letter-spacing:.3em;text-transform:uppercase;color:var(--mint)}
.status{display:flex;gap:8px;flex-wrap:wrap}
.pill{display:inline-flex;align-items:center;gap:6px;border-radius:999px;padding:5px 11px;font-size:12.5px;font-weight:800;border:1px solid var(--edge);background:rgba(11,30,63,.6);color:var(--snow)}
.pill i{width:8px;height:8px;border-radius:50%;background:var(--gold)}
.pill.open i{background:var(--mint)}
.btn{border:0;border-radius:999px;padding:11px 18px;font-weight:800;background:var(--ice);color:#fff;text-decoration:none;display:inline-flex;gap:8px;align-items:center;justify-content:center}
.btn.aurora{background:linear-gradient(135deg,#2A6F97,#6b55c9);color:#fff}
.btn.ghost{background:transparent;border:1px solid var(--edge);color:var(--snow)}
.btn.apple{background:#000;color:#fff;width:100%;border-radius:12px}
.btn.gpay{background:#fff;color:#1f1f1f;width:100%;border-radius:12px;border:1px solid #dadce0}
.btn.sm{padding:7px 13px;font-size:13.5px}
.strip{display:flex;gap:10px;overflow-x:auto;scrollbar-width:none;padding-bottom:2px}
.now{flex:0 0 220px;border-radius:18px;padding:14px;background:var(--mid2);border:1px solid var(--edge);display:flex;flex-direction:column;gap:4px}
.now b{font-size:15px}
.tiles{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px}
.tile{border:1px solid var(--edge);border-radius:22px;padding:16px;text-align:left;background:linear-gradient(150deg,rgba(23,53,99,.95),rgba(17,40,79,.95));display:flex;flex-direction:column;gap:8px;min-height:130px}
.tile .gem{width:42px;height:42px;display:grid;place-items:center;color:var(--mid);clip-path:polygon(25% 5%,75% 5%,100% 50%,75% 95%,25% 95%,0 50%)}
.tile .gem svg{width:22px;height:22px}
.tile b{font-family:var(--display);font-size:14.5px;letter-spacing:.06em}
.tile small{color:var(--muted);font-weight:600}
.chips{display:flex;gap:6px;overflow-x:auto;scrollbar-width:none;padding-bottom:2px}
.chips button,.chips select{flex:0 0 auto;border:1px solid var(--edge);background:var(--mid2);border-radius:999px;padding:7px 12px;font-weight:700;font-size:13px;color:var(--snow)}
.chips button[aria-pressed="true"]{background:var(--frost);border-color:var(--frost);color:var(--mid)}
.seg{display:flex;gap:4px;padding:4px;border-radius:999px;background:var(--mid2);border:1px solid var(--edge)}
.seg button{flex:1;border:0;background:transparent;border-radius:999px;padding:8px 10px;font-weight:800;font-size:13.5px;color:var(--muted)}
.seg button[aria-pressed="true"]{background:linear-gradient(135deg,#2A6F97,#6b55c9);color:#fff}
.sw{width:14px;height:14px;border-radius:4px;flex:0 0 auto}
.tag{display:inline-block;font-size:10.5px;font-weight:800;letter-spacing:.06em;text-transform:uppercase;border-radius:999px;padding:2px 8px;border:1px solid var(--edge);color:var(--snow)}
.tag.diet{border-color:var(--mint);color:var(--mint)}
.tag.alg{border-color:var(--rose);color:var(--rose)}
.mi .p{font-weight:800;color:var(--frost);font-variant-numeric:tabular-nums}
.heart{background:none;border:0;padding:4px;color:var(--muted)} .heart svg{width:22px;height:22px}
.heart[aria-pressed="true"]{color:var(--rose)}
.prod{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:10px;align-items:center;padding:14px;border:1px solid var(--edge);border-radius:18px;background:var(--mid2)}
.slots{display:flex;gap:6px;flex-wrap:wrap}
.slots button{border:1px solid var(--edge);background:var(--mid3);border-radius:10px;padding:7px 10px;font-weight:700;font-size:13px;color:var(--snow)}
.slots button[aria-pressed="true"]{background:var(--frost);color:var(--mid)}
.inp{border:1px solid var(--edge);background:var(--mid);color:var(--snow);border-radius:12px;padding:11px 12px;width:100%}
.or{display:flex;align-items:center;gap:10px;color:var(--muted);font-size:12px} .or::before,.or::after{content:"";flex:1;height:1px;background:var(--edge)}
.qr{background:#fff;border-radius:12px;padding:8px;width:120px;height:120px}
.qr canvas{width:104px;height:104px;image-rendering:pixelated}
.homemap#wmap{height:260px}
.days{display:flex;flex-direction:column;gap:8px}
.day{display:grid;grid-template-columns:56px minmax(0,1fr);gap:12px;align-items:start;text-align:left;color:var(--snow);background:rgba(255,255,255,.06);border:1px solid var(--edge);border-radius:18px;padding:12px;font:inherit;cursor:pointer}
.day .dd{display:flex;flex-direction:column;align-items:center;border-radius:12px;padding:6px 0;background:rgba(168,216,234,.14)}
.day .dd b{font-size:22px;line-height:1}
.day .dd small{font-size:11px;letter-spacing:.08em;text-transform:uppercase;color:var(--frost)}
.day .de{display:flex;flex-direction:column;gap:6px;font-size:14px;min-width:0}
.day .de small{color:var(--frost);font-size:12.5px}
#wmap{height:380px;width:100%;border-radius:22px;overflow:hidden;background:#cfd8e3;border:1px solid var(--edge)}
.nav{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(14px + env(safe-area-inset-bottom,0px));z-index:7;display:flex;gap:2px;padding:6px;border-radius:999px;background:rgba(17,40,79,.86);border:1px solid var(--edge);backdrop-filter:blur(16px);-webkit-backdrop-filter:blur(16px);box-shadow:0 10px 30px rgba(0,0,0,.4);width:min(500px,calc(100% - 24px))}
.nav button{flex:1;border:0;background:transparent;border-radius:999px;padding:8px 2px;display:flex;flex-direction:column;align-items:center;gap:2px;font-size:10.5px;font-weight:800;color:var(--muted)}
.nav button svg{width:21px;height:21px}
.nav button[aria-current="page"]{background:linear-gradient(135deg,#2A6F97,#6b55c9);color:#fff}
.scrim{position:fixed;inset:0;background:rgba(3,10,25,.6);z-index:9;display:flex;align-items:flex-end;justify-content:center}
.sheet{width:100%;max-width:520px;max-height:88%;overflow-y:auto;border-radius:26px 26px 0 0;padding:20px 18px calc(24px + env(safe-area-inset-bottom,0px));background:var(--mid2);border-top:1px solid var(--edge);display:flex;flex-direction:column;gap:12px}
.sheetfoot{display:flex;gap:8px;justify-content:flex-end;flex-wrap:wrap}
.toast{position:fixed;left:50%;top:calc(76px + env(safe-area-inset-top,0px));transform:translateX(-50%);background:var(--frost);color:var(--mid);border-radius:999px;padding:10px 18px;font-weight:800;font-size:14px;z-index:10;max-width:calc(100% - 32px)}
.leaflet-container{font-family:var(--body)} .leaflet-popup-content{color:#0B1E3F}
#bgsnow{position:fixed;inset:0;width:100vw;height:100vh;z-index:0;pointer-events:none}
#skyline{position:fixed;left:0;right:0;bottom:0;width:100%;height:150px;z-index:0;pointer-events:none;opacity:.5}
.app{position:relative;z-index:1}
.count{display:flex;gap:8px}
.count div{background:rgba(11,30,63,.7);border:1px solid var(--edge);border-radius:14px;padding:8px 10px;text-align:center;min-width:58px}
.count b{display:block;font-family:var(--display);font-size:22px;line-height:1.1}
.count span{font-size:10.5px;font-weight:800;letter-spacing:.1em;text-transform:uppercase;color:var(--muted)}
.funrow{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:10px}
.funrow .tile{min-height:110px;padding:12px}
.ev{display:grid;grid-template-columns:62px minmax(0,1fr) auto auto;gap:8px;align-items:center;padding:10px 12px;border:1px solid var(--edge);border-radius:14px;background:var(--mid2)}
.ev .tm{font-weight:800;color:var(--frost);font-size:13.5px}
.bell{background:none;border:0;padding:4px;color:var(--muted)} .bell svg{width:20px;height:20px} .bell[aria-pressed="true"]{color:var(--gold)}
@media (prefers-reduced-motion: reduce){ .hero::before{animation:none} *{transition:none!important} }

.pms{display:flex;gap:6px;flex-wrap:wrap}
.pms button{border:1.5px solid rgba(168,216,234,.35);background:rgba(11,30,63,.55);color:var(--snow);border-radius:999px;padding:8px 13px;font-weight:800;font-size:13.5px}
.pms button[aria-pressed="true"]{background:var(--snow);color:#0B1E3F;border-color:var(--snow)}
.lines{display:flex;flex-direction:column;gap:4px;font-size:14.5px}
.lines div{display:flex;justify-content:space-between;gap:10px}
.total{display:flex;justify-content:space-between;font-family:var(--display);font-size:20px;border-top:1px solid rgba(168,216,234,.3);padding-top:8px}
.step{display:flex;align-items:center;justify-content:space-between;gap:10px;padding:8px 0;border-bottom:1px solid rgba(168,216,234,.18)}
.step .ctl{display:flex;align-items:center;gap:10px}
.step .ctl button{width:36px;height:36px;border-radius:50%;border:1.5px solid rgba(168,216,234,.45);background:transparent;color:var(--snow);font-size:18px;font-weight:800}
.step output{min-width:22px;text-align:center;font-weight:800;font-size:17px}
.order{border:1px solid rgba(168,216,234,.3);border-radius:20px;padding:14px;background:rgba(15,40,80,.72);display:flex;flex-direction:column;gap:10px}
.ohead{display:flex;justify-content:space-between;gap:10px;align-items:flex-start}
.st-paid{border-color:#5EE6C8!important;color:#5EE6C8!important}
.st-pending{border-color:#D8C27A!important;color:#D8C27A!important}
.tkrow{display:flex;gap:12px;overflow-x:auto;scroll-snap-type:x mandatory;padding-bottom:6px;scrollbar-width:thin}
.tk{flex:0 0 82%;max-width:300px;scroll-snap-align:center;border-radius:18px;padding:14px;background:linear-gradient(160deg,#F4FAFD,#E6F4FA);color:#0B1E3F;display:flex;flex-direction:column;gap:8px;align-items:center;text-align:center}
.tk .qr{background:#fff;padding:8px;border-radius:10px;width:136px;height:136px}
.tk .qr img,.tk .qr canvas{width:120px!important;height:120px!important}
.tk input{width:100%;border:1.5px solid #9fb9d6;border-radius:10px;padding:8px 10px;font:inherit;text-align:center;color:#0B1E3F;background:#fff}
.tk .ser{font-family:ui-monospace,Consolas,monospace;font-size:12.5px;color:#1F4E79}
.tk .tst{font-size:12px;font-weight:800;letter-spacing:.08em;text-transform:uppercase}
.tk .btn{width:100%}
.tk.done{opacity:.75}
.scanbox{position:relative;border-radius:18px;overflow:hidden;background:#06122a;aspect-ratio:1/1;max-width:100%}
.scanbox video{width:100%;height:100%;object-fit:cover;display:block}
.scanbox .frame{position:absolute;inset:18%;border:3px solid #5EE6C8;border-radius:18px;box-shadow:0 0 0 999px rgba(6,18,42,.45)}
.scanmsg{font-size:13.5px;color:var(--frost)}
#admit{position:fixed;inset:0;z-index:30;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:14px;padding:24px;text-align:center;color:#F4FAFD;background:radial-gradient(120% 90% at 50% 10%,#2A6F97 0%,#1F4E79 35%,#0B1E3F 80%)}
#admit h2{font-family:var(--display);font-size:40px;letter-spacing:.12em;color:#5EE6C8;margin:0}
#admit svg{width:120px;height:120px}
#admit .ck{stroke-dasharray:80;stroke-dashoffset:80;animation:ck .6s .2s ease forwards}
@keyframes ck{to{stroke-dashoffset:0}}
#admit ul{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:6px;font-size:18px;font-weight:700}
#admit li{opacity:0;animation:fadein .35s ease forwards}
@keyframes fadein{to{opacity:1}}
@media (prefers-reduced-motion: reduce){ #admit .ck{animation:none;stroke-dashoffset:0} #admit li{animation:none;opacity:1} }
.snowgrid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}
.snowcard{margin:0;border-radius:16px;overflow:hidden;background:#13305d;border:1px solid rgba(168,216,234,.25)}
.snowcard img{display:block;width:100%;aspect-ratio:1/1;object-fit:cover;max-width:100%}
.snowcard figcaption{padding:8px 10px;display:flex;flex-direction:column;gap:4px;color:var(--snow)}
</style>

<script>
(function(){
// Brand shown in the app. The App Store name is Katelyn's call (Newport Life owns Winterfest); rename here only.
const APP_BRAND = "Newport Winter Festival"; // official name from the logo Katelyn sent 2026-10-09; App Store name is still her call
const TRAFFIC = "https://www.google.com/maps/@41.4815,-71.3150,14z/data=!5m1!1e1";
const PAY_ACCEPTED = ["Card", "Apple Pay", "Google Pay"];
const PRODUCTS = [];   // no ice rink (Michael, 2026-10-26); Signature events are added from SIG below
// Igloos are at The Reef and are booked on Resy (Katelyn, 2026-10-09). Paste the Resy link here when Newport Life has it.
const RESY_REEF_URL = "";
function resyBtn(cls){ return RESY_REEF_URL ? `<a class="btn ${cls||"aurora"}" href="${RESY_REEF_URL}" target="_blank" rel="noopener" style="text-decoration:none">Book on Resy</a>` : `<button class="btn ${cls||"ghost"}" type="button" data-resy="1">Resy link coming</button>`; }
const SLOTS = ["4:00","5:30","7:00","8:30"];
// ---------- Payments. Rail to be set (Stripe, per Katelyn 2026-10-23); legacy note: Audrain's Shopify store; Newport Life's own payment account is to be decided (its checkout shows Shop Pay, PayPal, Google Pay, Venmo and card; Apple Pay on Apple devices).
// Every Winterfest item is "pending" until Audrain creates it in Shopify. To go live: create the item (no shipping),
// paste one variant id per ticket type below, and set rail:"shopify". Example: "s27-1":{rail:"shopify", variants:{adult:44000000000001, child:44000000000002, infant:44000000000003}}
const STORE = "https://shop.audrainautomuseum.org";
const PAY = {
  entry:{rail:"pending"}
};
const TYPES = [{k:"adult", n:"Adult", f:1}, {k:"child", n:"Child (3-12)", f:0.6}, {k:"infant", n:"Under 3", f:0}];
const AREA = {entry:"entry"};
const AREA_NAME = {entry:"Event entry"};
const AREA_SHORT = {entry:"ENT"};
const SHORT_AREA = {ENT:"entry"};
function cartLink(items){ return STORE + "/cart/" + items.map(i=>i.variant + ":" + i.qty).join(","); }
function isApple(){ const u = navigator.userAgent; return !!window.ApplePaySession || /iPhone|iPad|iPod/.test(u) || (/Macintosh/.test(u) && /Safari/.test(u) && !/Chrome|Chromium|Edg|Firefox/.test(u)); }
const money = n => "$" + (Math.round(n*100)/100).toFixed(n % 1 ? 2 : 0);
const ALERTS = [["The 2027 lineup is posted","See the itinerary for every event, Feb 12-21. Events marked To be confirmed may change.","news"]];
const st = { get(k,f){ try{ const v = localStorage.getItem(k); return v ? JSON.parse(v) : f; }catch(e){ return f; } }, set(k,v){ try{ localStorage.setItem(k, JSON.stringify(v)); }catch(e){} } };
const S = { tab:"village", mapv:"getting", visits:st.get("wf.visits",[]), account:st.get("wf.account",null), cart:null, slot:SLOTS[0], seenAlerts:st.get("wf.seen",false),
  fun:"guide", evfav:new Set(st.get("wf.evfav",[])), evrem:new Set(st.get("wf.evrem",[])),
  payMethod:null, qty:{adult:1, child:0, infant:0}, expanded:new Set(), iday:"all", ilayer:"all", snow:st.get("wf.snow",[]) };
S.outside = st.get("wf.outside", []);
S.visits = S.visits.map(v => (v.kind!=="booking" || v.tickets) ? v : Object.assign({}, v, {area: "entry", slot: (v.when||"").replace(" PM",""), status:"paid", tickets:[{serial:v.ref + "-1", type:"Adult", holder:"", used:false, checkins:[], transferred:false}]}));
const $ = s => document.querySelector(s);

// ---------- Live tickets (Supabase, newport-life-events). Tickets issued by Newport Life (comps, door sales, admin,
// later in-app purchases) come from tix.my_tickets and lock to this phone. Without a connection the app keeps its
// own bookings only. Live QR: WINTERFEST-TICKET:<serial>:<token>. Claim code: WINTERFEST-CLAIM:<serial>:<token>.
const LIVE = window.SB || null;
const LIVE_AREA = {entry:"entry"};
S.live = [];
const liveOn = () => !!(LIVE && LIVE.ok);
const findOrder = id => S.visits.find(v=>v.id===id) || S.live.find(v=>v.id===id);
const liveWhen = t => t.starts_at ? new Date(t.starts_at).toLocaleString("en-US",{weekday:"short", month:"short", day:"numeric", hour:"numeric", minute:"2-digit"}) : "Winterfest 2027 · time to be confirmed";
function buildLive(rows){
  const by = {};
  rows.forEach(t=>{ const k = t.order_id || t.id;
    const o = by[k] || (by[k] = {id:"L-"+k, ref:"#"+String(k).slice(0,8).toUpperCase(), kind:"booking", live:true, name:t.event || "Winterfest ticket",
      when:liveWhen(t), area:LIVE_AREA[t.event_slug] || "entry", status:"paid", channel:t.order_channel, slot:"", tickets:[]});
    o.tickets.push({id:t.id, serial:t.serial, qr:t.qr, type:t.type || "Ticket", holder:t.holder || "", comp:t.is_comp,
      used:(t.used||[]).length>0, usedOn:(t.used||[]).slice(-1)[0] || "", checkins:[], transferred:!t.mine, waiting:t.waiting_for || "" });
  });
  return Object.values(by);
}
let liveBusy = null;
function refreshLive(){
  if(!liveOn() || !LIVE.user) return Promise.resolve();
  return liveBusy || (liveBusy = LIVE.rpc("tix","my_tickets",{p_app:"winterfest"}).then(rows=>{ S.live = buildLive(rows||[]); render(); })
    .catch(e=>console.warn("[live] tickets", e.message)).finally(()=>{ liveBusy = null; }));
}
// Claim codes: WINTERFEST-CLAIM:<serial>:<token>, a #claim-<serial>:<token> link, or a pasted link.
function liveClaimCode(raw){ const m = String(raw||"").match(/([A-Z]{2,4}-[A-F0-9]{8}):([A-F0-9]{24})/i); return m ? "WINTERFEST-CLAIM:" + m[1].toUpperCase() + ":" + m[2].toLowerCase() : null; }
function liveClaim(raw){
  const code = liveClaimCode(raw); if(!code) return false;
  if(!liveOn()){ toast("No connection. Try again when you're online."); return true; }
  LIVE.rpc("tix","claim_ticket",{p_qr:code, p_device:navigator.userAgent.slice(0,80)}).then(t=>{
    closeSheet(); toast(`${t.type || "Ticket"} ${t.serial} is now on this phone`); S.tab = "tickets";
    return refreshLive().then(()=>{ const o = S.live.find(x=>x.tickets.some(k=>k.id===t.id)); if(o){ S.expanded.add(o.id); render(); } });
  }).catch(e=>toast(e.message));
  return true;
}

function liveGateCode(code){ const t = String(code||"").trim().toUpperCase(); if(/^\d{4}$/.test(t)) return t;

function liveCheckIn(o, code){
  const msg = t => { const m = document.getElementById("scanMsg"); if(m) m.textContent = t; };
  const gate = liveGateCode(code); if(!gate){ msg("That isn't a Winterfest check-in code."); return; }
  const g = parseGate(code); if(g && g.area !== o.area){ msg(`This code is for the ${AREA_NAME[g.area].toLowerCase()} gate. Your tickets are for the ${AREA_NAME[o.area].toLowerCase()}.`); return; }

async function decodeCanvas(c){

  s.onload = ()=>{ try{ window.pdfjsLib.GlobalWorkerOptions.workerSrc = "https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.worker.min.js"; }catch(e){} res(!!window.pdfjsLib); }; s.onerror = ()=>res(false); document.head.appendChild(s); }); }
async function pdfToCanvas(file){
  if(!(await loadPdfJs())) throw new Error("pdf.js");
  const pdf = await window.pdfjsLib.getDocument({data: await file.arrayBuffer()}).promise, pg = await pdf.getPage(1);
  const v1 = pg.getViewport({scale:1}), vp = pg.getViewport({scale: Math.min(3, 1600/Math.max(v1.width, v1.height))});

async function startCamera(){

  if(!navigator.mediaDevices || !navigator.mediaDevices.getUserMedia){ msg("This device can't open the camera here. Type the gate code instead."); return; }
  try{
    scan.stream = await navigator.mediaDevices.getUserMedia({video:{facingMode:"environment"}, audio:false});
    const v = document.getElementById("scanVid"); if(!v){ stopCamera(); return; } v.srcObject = scan.stream; await v.play();
    if("BarcodeDetector" in window){ try{ scan.det = new BarcodeDetector({formats:["qr_code"]}); }catch(e){ scan.det = null; } }

// Full-screen falling snow behind every screen: one persistent canvas, two depth layers, DPR-aware, pauses when hidden.
function bgSnow(){
  const c = document.getElementById("bgsnow"); if(!c) return; const x = c.getContext("2d");
  const reduce = matchMedia("(prefers-reduced-motion: reduce)").matches; let W = 0, H = 0, flakes = [], raf = null;
  function size(){ const dpr = Math.min(window.devicePixelRatio||1, 2); W = innerWidth; H = innerHeight; c.width = W*dpr; c.height = H*dpr; x.setTransform(dpr,0,0,dpr,0,0);
    const n = W < 600 ? 90 : 140; while(flakes.length < n) flakes.push(make(true)); flakes.length = n; if(reduce) draw(); }
  function make(anyY){ const big = Math.random() < .3; return {x:Math.random()*W, y:anyY ? Math.random()*H : -6, r: big ? 1.8+Math.random()*1.4 : 0.6+Math.random()*0.9, v: big ? 0.6+Math.random()*0.5 : 0.2+Math.random()*0.3, a: big ? .85 : .55, p:Math.random()*6.28}; }
  function draw(){ x.clearRect(0,0,W,H); x.fillStyle = "#F4FAFD"; flakes.forEach(f=>{ x.globalAlpha = f.a; x.beginPath(); x.arc(f.x,f.y,f.r,0,6.283); x.fill(); }); x.globalAlpha = 1; }
  function step(){ flakes.forEach(f=>{ f.y += f.v; f.p += 0.012; f.x += Math.sin(f.p)*0.35; if(f.y > H+6){ Object.assign(f, make(false)); } }); draw(); raf = requestAnimationFrame(step); }
  x.fillStyle = "#F4FAFD"; size(); addEventListener("resize", ()=>{ size(); x.fillStyle = "#F4FAFD"; });
  if(reduce) return;
  document.addEventListener("visibilitychange", ()=>{ if(document.hidden){ cancelAnimationFrame(raf); raf = null; } else if(!raf) raf = requestAnimationFrame(step); });
  raf = requestAnimationFrame(step); window.__snowFrames = ()=>flakes.reduce((a,f)=>a+f.y,0);
}

// Web: they go off while the app is open (service-worker notification), and "Add to calendar" gives a phone-calendar alert.
const evStart = e => { if(!e.t) return null; const [h,m] = e.t.split(":").map(Number); return new Date(2027, 1, 12 + e.d, h, m); };

  const [a,b] = alertIds(e), where = e.place + (VENUES[e.place] ? ", " + VENUES[e.place].addr : "");
  return [{id:a, at:new Date(s.getTime() - 30*6e4), title:e.name + " starts in 30 minutes", body:where},
          {id:b, at:s, title:e.name + " is starting now", body:where}].filter(x=>x.at.getTime() > Date.now()); }

  return "denied"; }

  if(d.outedit){ const o = S.outside.find(x=>x.id===d.outedit); if(o) outStep1(Object.assign({}, o)); return; }
  if(d.outdel){ const o = S.outside.find(x=>x.id===d.outdel); if(!o) return; openSheet("Delete this ticket?", `<p class="muted">${esc(o.name)} will be removed from this phone. Your ticket with ${esc(o.seller)} isn't affected.</p><div class="sheetfoot"><button class="btn ghost" type="button" data-close="1">Keep</button><button class="btn" type="button" data-outdelok="${o.id}" style="background:#b23a48">Delete</button></div>`); return; }
  if(d.outdelok){ S.outside = S.outside.filter(x=>x.id!==d.outdelok); saveOut(); S.evrem.delete("out:" + d.outdelok); st.set("wf.evrem", [...S.evrem]); closeSheet(); render(); toast("Ticket deleted"); return; }
  if(d.resy){ toast("The Reef's Resy link is coming from Newport Life"); return; }
  if(d.submitevent){ submitEventSheet(); return; }
  if(d.submitgo){ const biz = ($("#seBiz").value||"").trim(), nm = ($("#seName").value||"").trim(); if(!biz || !nm){ toast("Add the business and event name"); return; } closeSheet(); toast("Sent to Newport Life for review"); return; }
  if(d.snowsubmit){ const f = $("#snFile").files[0], title = ($("#snTitle").value||"").trim() || "Untitled snowman";
    if(!f){ toast("Add a photo of your snowman or drawing"); return; } if(!$("#snConsent").checked){ toast("Tick the consent box to enter"); return; }
    thumb(f).then(img=>{ S.snow.unshift({id:ref("SNO"), title, kind:$("#snKind").value, by:(S.account && S.account.name) || "Guest", img, featured:false}); try{ st.set("wf.snow", S.snow.slice(0,24)); }catch(e){} toast("Entry received. Good luck!"); render(); }).catch(()=>toast("That photo couldn't be read")); return; }
  if(d.feature){ const x = S.snow.find(e=>e.id===d.feature); if(x){ x.featured = !x.featured; st.set("wf.snow", S.snow); render(); } return; }
  if(d.gotab){ closeSheet(); go(d.gotab); return; }
  if(d.mapv){ S.mapv = d.mapv; render(); return; }
  if(d.venue || d.venuepin){ S.venueFocus = d.venue || d.venuepin; S.tab = "map"; S.mapv = "getting"; go("map"); if(d.venuepin) document.getElementById("wmap")?.scrollIntoView({behavior:"smooth", block:"center"}); return; }
  if(d.locate){ if(!navigator.geolocation){ toast("Location isn't available on this device"); return; } navigator.geolocation.getCurrentPosition(p=>{ if(!wmap) return; const ll = [p.coords.latitude, p.coords.longitude]; L.circleMarker(ll, {radius:8, color:"#0B1E3F", weight:2, fillColor:"#5EE6C8", fillOpacity:1}).addTo(wmap).bindPopup("You are here").openPopup(); wmap.setView(ll, 16); }, ()=>toast("Location permission was declined"), {enableHighAccuracy:true, timeout:10000}); return; }
  if(d.evfav){ const k = d.evfav; S.evfav.has(k) ? S.evfav.delete(k) : S.evfav.add(k); st.set("wf.evfav", [...S.evfav]); render(); return; }
  if(d.evrem){ toggleEventAlert(d.evrem); return; }
  if(d.ics){ downloadIcs(d.ics); return; }
  if(d.book){ const bp = PRODUCTS.find(x=>x.id===d.book); S.slot = SLOTS[0]; if(bp && bp.sig) S.slot = bp.time; S.qty = {adult:1, child:0, infant:0}; bookSheet(d.book); return; }
  if(d.qty){ const [k, dv] = d.qty.split("|"); S.qty[k] = Math.max(0, Math.min(10, S.qty[k] + Number(dv))); bookPaint(); return; }
  if(d.slot){ S.slot = d.slot; bookPaint(); return; }
  if(d.checkout){ const p = PRODUCTS.find(x=>x.id===d.checkout);
    const lines = TYPES.map(t=>({type:t.k, qty:S.qty[t.k], name:t.n, price:priceOf(p,t)})).filter(l=>l.qty), total = lines.reduce((a,l)=>a + l.qty*l.price, 0), slot = S.slot;
    if(!lines.length){ toast("Add at least one ticket"); return; }
    const done = (res)=>{ const r = ref("WF"), tk = []; lines.forEach(l=>{ for(let k=0;k<l.qty;k++) tk.push({serial:`${r}-${tk.length+1}`, type:l.name, holder:"", used:false, checkins:[], transferred:false}); });
      const o = {id:r, ref:r, kind:"booking", product:p.id, name:p.name, when:p.when || `${slot} PM`, slot: p.time ? p.time.split(":").map(Number).map((v,k)=>k?String(v).padStart(2,"0"):((v%12)||12)).join(":") : slot, area:AREA[p.id], status:(res&&res.status)||"paid", tickets:tk};
      addVisit(o); S.expanded.add(r); toast(`${tk.length} ticket${tk.length===1?"":"s"} for ${p.name}, ${p.when || slot + " PM"}`); S.tab = "tickets"; render(); };
    if(!total){ if(!S.account){ afterSignIn = ()=>done({status:"paid"}); signInSheet("Sign in to reserve your entry time."); return; } closeSheet(); done({status:"paid"}); return; }
    payWith({label:`${p.name} · ${p.when || slot + " PM"}`, total, key:p.id, lines}, done); return; }
  if(d.pm){ S.payMethod = d.pm; if(payPaint) payPaint(); return; }
  if(d.paidext){ closeSheet(); const f = pendingPay; pendingPay = null; if(f) f({status:"pending"}); render(); return; }
  if(d.expand){ S.expanded.has(d.expand) ? S.expanded.delete(d.expand) : S.expanded.add(d.expand); render(); return; }
  if(d.checkall){ const o = findOrder(d.checkall); checkInSheet(o.id, eligible(o)); return; }
  if(d.checkone){ const [id, i] = d.checkone.split("|"); checkInSheet(id, [Number(i)]); return; }
  if(d.gatecode){ handleGate(($("#gateCode").value||"")); return; }
  if(d.admitdone){ $("#admit").hidden = true; return; }
  if(d.send && (findOrder(d.send.split("|")[0])||{}).live){ const [id, i] = d.send.split("|"), o = findOrder(id); liveSendSheet(o, o.tickets[Number(i)]); return; }
  if(d.livesend){ const to = ($("#sendTo").value||"").trim(); if(!/^[^@\s]+@[^@\s]+\.[^@\s]+$/.test(to)){ toast("Enter their email"); return; }
    b.disabled = true; LIVE.rpc("tix","send_ticket",{p_ticket_id:d.livesend, p_to_email:to}).then(t=>{ liveSent(t); refreshLive(); }).catch(e=>{ b.disabled = false; toast(e.message); }); return; }
  if(d.liveshare){ navigator.share({title:"Your Winterfest ticket", url:d.liveshare}).catch(()=>{}); return; }
  if(d.liveauthsw){ liveAuthSheet(d.liveauthsw); return; }
  if(d.liveauth){ const e = ($("#authEmail").value||"").trim(), p = $("#authPw").value||"";
    if(!/^[^@\s]+@[^@\s]+\.[^@\s]+$/.test(e)){ toast("Enter a valid email"); return; } if(p.length < 8){ toast("Use at least 8 characters for the password"); return; }
    b.disabled = true; (d.liveauth==="up" ? LIVE.signUp(e, p) : LIVE.signIn(e, p))
      .then(()=>LIVE.rpc("tix","claim_my_tickets",{p_device:navigator.userAgent.slice(0,80)})).then(r=>{
        closeSheet(); toast(r && r.loaded ? `Signed in · ${r.loaded} ticket${r.loaded===1?"":"s"} loaded` : "Signed in"); refreshLive();
        const f = afterSignIn; afterSignIn = null; if(f) setTimeout(f, 150); })
      .catch(err=>{ b.disabled = false; toast(err.message); }); return; }
  if(d.send){ const [id, i] = d.send.split("|"), o = findOrder(id), t = o.tickets[Number(i)], code = `WFX-${AREA_SHORT[o.area]}-${t.serial}`, link = location.href.split("#")[0] + "#claim-" + code;
    openSheet("Send this ticket", `<p class="muted">${esc(t.holder || t.type)} · ${esc(o.name)} · ${esc(o.when)}</p><p>Share this code or link. Whoever adds it gets the ticket on their phone, and it stops working on yours.</p>
      <div class="glass" style="padding:12px;font-family:ui-monospace,Consolas,monospace;word-break:break-all">${esc(code)}<br><span style="font-size:12px;color:var(--frost)">${esc(link)}</span></div>
      <div class="sheetfoot"><button class="btn ghost" type="button" data-copy="${esc(link)}">Copy link</button><button class="btn aurora" type="button" data-dosend="${id}|${i}">Mark as sent</button></div><p class="muted" style="font-size:12.5px">Transfers stay on this phone until ticketing is live.</p>`); return; }
  if(d.copy){ (navigator.clipboard ? navigator.clipboard.writeText(d.copy) : Promise.reject()).then(()=>toast("Link copied")).catch(()=>toast("Copy the code shown")); return; }
  if(d.dosend){ const [id, i] = d.dosend.split("|"), o = findOrder(id); o.tickets[Number(i)].transferred = true; st.set("wf.visits", S.visits); closeSheet(); toast("Ticket sent. It now shows Transferred."); render(); return; }
  if(d.claimopen){ claimSheet(""); return; }
  if(d.claim){ if(liveClaim($("#claimCode").value)) return; const c = ($("#claimCode").value||"").trim().toUpperCase(), m = c.match(/^WFX-(ENT)-(WF-[A-Z0-9]{5}-\d+)$/);
    if(!m){ toast("That code doesn't look right. It starts with WFX-"); return; }
    if(S.visits.some(v=>v.tickets && v.tickets.some(t=>t.serial===m[2] && !t.transferred))){ toast("That ticket is already on this phone"); return; }
    const r = ref("WF"); addVisit({id:r, ref:r, kind:"booking", name:"Ticket sent to you", when:"See the booking details", slot:"7:00", area:SHORT_AREA[m[1]], status:"paid", received:true, tickets:[{serial:m[2], type:"Shared ticket", holder:"", used:false, checkins:[], transferred:false}]});
    S.expanded.add(r); closeSheet(); toast("Ticket added to My tickets"); S.tab = "tickets"; render(); return; }
  if(d.signin){ signInSheet(); return; }
  if(d.signout && liveOn()){ LIVE.signOut().then(()=>{ S.account = null; st.set("wf.account", null); S.live = []; closeSheet(); toast("Signed out"); refreshLive(); render(); }).catch(e=>toast(e.message)); return; }
  if(d.signout){ S.account = null; st.set("wf.account", null); closeSheet(); toast("Signed out"); render(); return; }
  if(d.delacct){ openSheet("Delete your account?", `<p class="muted">This removes your account, favourites and saved bookings from ${APP_BRAND}. Paid tickets stay valid with your order email.</p><div class="sheetfoot"><button class="btn ghost" type="button" data-close="1">Keep account</button><button class="btn" type="button" data-delconfirm="1" style="background:#b23a48">Delete account</button></div>`); return; }
  if(d.delconfirm){ S.account = null; st.set("wf.account", null); S.visits = []; st.set("wf.visits", []); closeSheet(); toast("Account deleted"); render(); return; }
  if(d.close){ closeSheet(); return; }
  if(b.id==="alertBtn"){ alertsSheet(); return; }
  if(b.id==="infoBtn"){ infoSheet(); return; }
  if(b.id==="acctBtn"){ S.account ? accountSheet() : signInSheet(); return; }
});
document.addEventListener("change", ev=>{
  if(ev.target.id==="oEvent"){ const c = comById(ev.target.value); if(c){ $("#oName").value = c.name; $("#oSeller").value = c.biz; $("#oPlace").value = c.place; $("#oTime").value = c.t; if(c.d!=="all") $("#oDate").value = FEST_DAYS[c.d].key; } }
  if(ev.target.id==="oImg" && ev.target.files && ev.target.files[0]){ fileToCanvas(ev.target.files[0]).then(onOutFile).catch(()=>toast("Couldn't read that image")); }
  if(ev.target.id==="oPdf" && ev.target.files && ev.target.files[0]){ toast("Reading the PDF..."); pdfToCanvas(ev.target.files[0]).then(onOutFile).catch(()=>toast("Couldn't read that PDF - try a screenshot instead")); }
  if(ev.target.dataset && ev.target.dataset.holder){ const [id, i] = ev.target.dataset.holder.split("|"), o = findOrder(id);
    if(o && o.live){ const t = o.tickets[Number(i)], nm = ev.target.value.trim().slice(0,40); LIVE.rpc("tix","set_holder",{p_ticket_id:t.id, p_name:nm}).then(()=>{ t.holder = nm; toast("Name saved"); }).catch(e=>toast(e.message)); return; }
    if(o){ o.tickets[Number(i)].holder = ev.target.value.trim().slice(0,40); st.set("wf.visits", S.visits); toast("Name saved"); } } });
document.addEventListener("keydown", ev=>{ if(ev.key==="Escape"){ closeSheet(); $("#admit").hidden = true; } });
$("#scrim").addEventListener("click", ev=>{ if(ev.target.id==="scrim") closeSheet(); });
bgSnow();
(function(){ document.title = APP_BRAND; const i = document.querySelector('#brand img'); if(i) i.alt = APP_BRAND; })();
render();
if(LIVE) LIVE.onAuth(u=>{ syncAccount(u); refreshLive(); });
if(/^#claim-/.test(location.hash)){ const h = decodeURIComponent(location.hash.slice(7));
  if(liveClaimCode(h) && LIVE){ LIVE.ready.then(()=>{ history.replaceState(null, "", location.pathname + location.search); if(!liveClaim(h)) claimSheet(h); }); }
  else setTimeout(()=>claimSheet(h), 300); }
})();
</script>
<script>if('serviceWorker' in navigator){addEventListener('load',()=>navigator.serviceWorker.register('sw.js').catch(()=>{}));}</script>
