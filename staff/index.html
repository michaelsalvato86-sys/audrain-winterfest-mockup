<title>Newport Winter Festival Staff</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Cinzel:wght@500;700&family=Nunito+Sans:opsz,wght@6..12,400;6..12,600;6..12,700;6..12,800&display=swap">
<style>
/* Layout: the Winterfest night-palace staff tool - midnight base, ice accents, Cinzel headers, tabs along the TOP (unlike the Concours staff app), big tap targets, team colour as the main signal. Single dark theme. */
:root{
  --bg:#0B1E3F; --panel:#11284F; --panel-2:#173563; --fg:#F4FAFD; --muted:#B9C8DE; --line:#24427a;
  --gold:#A8D8EA; --urgent:#e0533f; --ok:#3fae6b; --info:#5aa8e8;
  --display:"Cinzel", "Trajan Pro", Georgia, serif;
  --body:"Nunito Sans", system-ui, -apple-system, "Segoe UI", sans-serif;
  --mono:"IBM Plex Mono", ui-monospace, Consolas, monospace;
  color-scheme:dark;
}
*{box-sizing:border-box}
html,body{height:100%}
body{background:var(--bg);color:var(--fg);font-family:var(--body);font-size:15px;line-height:1.45;margin:0}
.app{max-width:480px;margin:0 auto;min-height:100%;display:flex;flex-direction:column}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer}
a{color:inherit}
:focus-visible{outline:2px solid var(--gold);outline-offset:2px}
.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:5;background:#081733;color:#eef1f6;padding:12px 16px;border-bottom:3px solid var(--team,#c9a14a)}
.row1{display:flex;justify-content:space-between;align-items:center;gap:10px}
.brand{font-family:var(--display);font-weight:700;font-size:22px;letter-spacing:.04em;text-transform:uppercase}
.brand small{display:block;font-family:var(--body);font-size:11px;font-weight:700;letter-spacing:.16em;color:#7fc4e8}
.who{display:flex;align-items:center;gap:8px;border:1px solid #2c3f63;border-radius:999px;padding:5px 10px 5px 6px;background:transparent;color:#eef1f6;font-size:13px;font-weight:600}
.sw{width:14px;height:14px;border-radius:4px;background:var(--team,#c9a14a);flex:0 0 auto}
main{flex:1;padding:16px 16px calc(28px + env(safe-area-inset-bottom,0px))}
.view{display:flex;flex-direction:column;gap:16px}
h1,h2{font-family:var(--display);font-weight:700;margin:0;letter-spacing:.02em;text-transform:uppercase;text-wrap:balance}
h1{font-size:30px;line-height:1.05}
h2{font-size:20px}
.label{font-size:11px;font-weight:700;letter-spacing:.14em;text-transform:uppercase;color:var(--muted)}
.notice{font-size:12.5px;color:var(--muted);border:1px dashed var(--line);border-radius:10px;padding:8px 10px}
.panel{background:var(--panel);border:1px solid var(--line);border-radius:14px}
.now{padding:16px;display:flex;flex-direction:column;gap:10px;border-left:6px solid var(--team)}
.now .where{font-family:var(--display);font-size:34px;font-weight:700;line-height:1;text-transform:uppercase}
.now .when{font-family:var(--mono);font-size:15px}
.now .task{color:var(--muted)}
.kv{display:flex;flex-wrap:wrap;gap:6px 14px;font-size:13px}
.kv b{font-weight:700}
.btns{display:flex;gap:8px;flex-wrap:wrap}
.btn{border:0;border-radius:10px;padding:10px 14px;font-weight:700;background:var(--gold);color:#16120a}
.btn.ghost{background:transparent;border:1px solid var(--line);color:var(--fg)}
.btn.ok{background:var(--ok);color:#fff}
.btn.danger{background:var(--urgent);color:#fff}
.list{background:var(--panel);border:1px solid var(--line);border-radius:14px;overflow:hidden}
.item{display:grid;grid-template-columns:62px minmax(0,1fr) auto;gap:10px;padding:12px;border-top:1px solid var(--line);align-items:center}
.item:first-child{border-top:0}
.t{font-family:var(--mono);font-size:13px}
.t span{display:block;color:var(--muted);font-size:11px}
.ti{font-weight:700;line-height:1.25}
.sub{font-size:12.5px;color:var(--muted)}
.pill{font-size:11px;font-weight:800;letter-spacing:.06em;text-transform:uppercase;border-radius:999px;padding:3px 8px;white-space:nowrap}
.days{display:flex;gap:6px;overflow-x:auto;scrollbar-width:none}
.days button{flex:0 0 auto;border:1px solid var(--line);background:var(--panel);border-radius:10px;padding:6px 12px;font-weight:700;font-size:13px}
.days button[aria-pressed="true"]{background:var(--gold);border-color:var(--gold);color:#16120a}
.teams{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}
.team{background:var(--panel);border:1px solid var(--line);border-top:5px solid var(--c);border-radius:12px;padding:12px;text-align:left;display:flex;flex-direction:column;gap:4px;min-width:0}
.team .n{font-family:var(--display);font-size:19px;font-weight:700;text-transform:uppercase;line-height:1.05}
.team[aria-pressed="true"]{box-shadow:0 0 0 2px var(--c)}
.roster .item{grid-template-columns:auto minmax(0,1fr) auto}
.av{width:34px;height:34px;border-radius:50%;display:grid;place-items:center;font-weight:800;font-size:13px;color:#0c1524;background:var(--c)}
.chan{display:flex;gap:6px;overflow-x:auto;scrollbar-width:none}
.chan button{flex:0 0 auto;border:1px solid var(--line);background:var(--panel);border-radius:999px;padding:6px 12px;font-size:13px;font-weight:600;display:flex;align-items:center;gap:6px}
.chan button[aria-pressed="true"]{border-color:var(--gold);color:var(--gold)}
.msgs{display:flex;flex-direction:column;gap:10px;min-height:280px}
.msg{max-width:84%;display:flex;flex-direction:column;gap:3px}
.msg .bub{background:var(--panel);border:1px solid var(--line);border-radius:14px 14px 14px 4px;padding:9px 12px}
.msg.me{align-self:flex-end}
.msg.me .bub{background:var(--gold);color:#16120a;border-color:var(--gold);border-radius:14px 14px 4px 14px}
.msg .by{font-size:11.5px;color:var(--muted);display:flex;gap:6px;align-items:center}
.msg.me .by{justify-content:flex-end}
.msg.loc .bub{border-left:4px solid var(--info)}
.compose{position:sticky;bottom:calc(10px + env(safe-area-inset-bottom,0px));display:flex;gap:8px;background:var(--bg);padding-top:8px}
.compose input{flex:1;min-width:0;border:1px solid var(--line);background:var(--panel);border-radius:12px;padding:10px 12px}
.mapbox{background:var(--panel);border:1px solid var(--line);border-radius:14px;overflow:hidden}
.mapbox svg{display:block;width:100%;height:auto}
.alert{display:grid;grid-template-columns:6px minmax(0,1fr);gap:12px;padding:12px;border-top:1px solid var(--line)}
.alert:first-child{border-top:0}
.alert .bar{border-radius:4px;background:var(--info)}
.alert.urgent .bar{background:var(--urgent)}
.alert.done{opacity:.55}
.field{display:flex;flex-direction:column;gap:4px}
.field select,.field input,.field textarea{border:1px solid var(--line);background:var(--panel-2);border-radius:10px;padding:9px 10px}
.tabs{position:static;background:transparent;padding:10px 0 0;margin:0 -8px}
.tabs nav{display:grid;grid-template-columns:repeat(7,1fr);gap:2px}
.tabs button{position:relative;background:none;border:0;color:#8c99b3;display:flex;flex-direction:column;align-items:center;gap:3px;font-size:10.5px;font-weight:700;letter-spacing:.04em;text-transform:uppercase;padding:4px 2px}
.tabs button svg{width:22px;height:22px}
.scanbox{position:relative;border-radius:16px;overflow:hidden;background:#06122a;aspect-ratio:1/1;max-width:100%}
.scanbox video{width:100%;height:100%;object-fit:cover;display:block}
.scanbox .frame{position:absolute;inset:18%;border:3px solid #5EE6C8;border-radius:16px;box-shadow:0 0 0 999px rgba(6,18,42,.35)}
.verdict{border-radius:16px;padding:16px;display:flex;flex-direction:column;gap:4px;font-weight:700}
.verdict b{font-size:26px;letter-spacing:.06em}
.verdict.ok{background:#1f7a52;color:#fff}.verdict.used{background:#d8a32a;color:#1a1300}.verdict.bad{background:#b23a48;color:#fff}
.help{background:linear-gradient(135deg,#b23a48,#e0533f);color:#fff;border:0;border-radius:14px;padding:14px;font-weight:800;font-size:16px;width:100%}
.ro{border:1px dashed var(--line);border-radius:12px;padding:10px;font-size:13.5px;color:var(--muted)}
.tabs button[aria-current="page"]{color:#0B1E3F;background:#A8D8EA;border-radius:10px}
.dotc{position:absolute;top:0;right:22%;background:var(--urgent);color:#fff;border-radius:999px;font-size:10px;min-width:16px;height:16px;display:grid;place-items:center;padding:0 4px}
.scrim{position:fixed;inset:0;background:rgba(0,0,0,.6);z-index:9;display:flex;align-items:flex-end;justify-content:center}
.sheet{background:var(--panel);width:100%;max-width:480px;max-height:88%;overflow-y:auto;border-radius:18px 18px 0 0;padding:18px 18px calc(22px + env(safe-area-inset-bottom,0px));display:flex;flex-direction:column;gap:12px}
.toast{position:fixed;left:50%;top:calc(150px + env(safe-area-inset-top,0px));transform:translateX(-50%);background:#081733;color:#eef1f6;border:1px solid var(--gold);border-radius:999px;padding:9px 16px;font-size:13.5px;font-weight:600;z-index:10;max-width:calc(100% - 32px)}
#bgsnow{position:fixed;inset:0;width:100vw;height:100vh;z-index:0;pointer-events:none}
.app{position:relative;z-index:1}
#gate{position:fixed;inset:0;z-index:30;background:radial-gradient(90% 50% at 80% 0%,rgba(94,230,200,.18),transparent 60%),#0B1E3F;display:flex;align-items:center;justify-content:center;padding:24px 16px}
#gate .box{width:100%;max-width:400px;background:rgba(17,40,79,.92);border:1px solid var(--line);border-radius:22px;padding:22px;display:flex;flex-direction:column;gap:12px}
#gate h1{font-family:var(--display);font-size:24px;margin:0;letter-spacing:.08em}
#gate input[type=email],#gate input[type=password],#gate input[type=text]{border:1px solid var(--line);background:#0B1E3F;color:var(--fg);border-radius:12px;padding:12px;width:100%}
.err{color:#ffb3a8;font-weight:700;font-size:13.5px;min-height:18px}
.linkbtn{background:none;border:0;padding:0;color:#A8D8EA;font-weight:700;text-decoration:underline;align-self:flex-start}
#pingBanner{position:fixed;left:50%;transform:translateX(-50%);top:calc(10px + env(safe-area-inset-top,0px));z-index:25;width:min(460px,calc(100% - 20px));background:linear-gradient(135deg,#2A6F97,#6b55c9);color:#fff;border-radius:18px;padding:14px;box-shadow:0 10px 30px rgba(0,0,0,.5);display:flex;flex-direction:column;gap:8px}
#pingBanner b{font-size:16px}
.acks{display:flex;gap:6px;flex-wrap:wrap}
.ackp{font-size:11.5px;font-weight:800;border-radius:999px;padding:3px 9px;background:var(--panel-2);color:var(--muted)}
.ackp.ok{background:var(--ok);color:#fff}
.dirmk{width:30px;height:30px;border-radius:50%;background:#5EE6C8;border:3px solid #0B1E3F;box-shadow:0 0 0 6px rgba(94,230,200,.35)}
@media (prefers-reduced-motion: reduce){ *{transition:none!important;animation:none!important} }
</style>
<style>/* Live (back end) additions 2026-10-09 */
.livepill{font-size:10px;font-weight:800;letter-spacing:.12em;border-radius:999px;padding:2px 7px;background:#2a3f66;color:#B9C8DE}
.livepill.on{background:var(--ok);color:#fff}
.admtabs{display:flex;gap:6px;flex-wrap:wrap}
.admtabs button{border:1px solid var(--line);background:var(--panel-2);border-radius:999px;padding:6px 12px;font-size:13px;font-weight:700}
.admtabs button[aria-pressed="true"]{background:var(--gold);color:#16120a;border-color:var(--gold)}
.claimqr{align-self:center;background:#fff;padding:14px;border-radius:18px;width:288px;height:288px}
.claimqr img,.claimqr canvas{width:260px!important;height:260px!important}
.mini{display:flex;flex-direction:column;gap:8px;border:1px solid var(--line);border-radius:12px;padding:10px;background:var(--panel-2)}
.rrow{display:grid;grid-template-columns:minmax(0,1fr);gap:6px;padding:10px 12px;border-top:1px solid var(--line)}
.rrow:first-child{border-top:0}
.rrow .ctl{display:flex;gap:6px;flex-wrap:wrap;align-items:center}
.rrow select,.rrow input[type=text]{border:1px solid var(--line);background:var(--panel-2);border-radius:8px;padding:6px 8px;font-size:13px}
@media (min-width:760px){ .app{max-width:760px} .sheet{max-width:680px} .tabs nav{gap:6px} }
</style>
<style>.gqbox{align-self:center;background:#fff;padding:14px;border-radius:16px;width:248px;height:248px}.gqbox img,.gqbox canvas{width:220px!important;height:220px!important}.gqcode{font-family:var(--mono);text-align:center;font-size:15px;letter-spacing:.06em}</style>

<script>
(function(){

const STAFF_LOCK = false;
const STAFF_DOMAINS = ["audrainautomuseum.org","audrainconcours.com","mwmwealth.com"];

// Team colour key. The real team for each person is set by an admin on the live roster; these are just the

const TEAMS = {

const store = { get(k,f){ try{ const v=localStorage.getItem(k); return v?JSON.parse(v):f; }catch(e){ return f; } }, set(k,v){ try{ localStorage.setItem(k,JSON.stringify(v)); }catch(e){} } };

const state = { tab: store.get("st.tab","shift"), team: store.get("st.team","ops"), chan:"team", chatSeen:false, scans:0, verdict:null, roster:[] };
// Winterfest 2027 venues from Katelyn's schedule (2026-10-22); addresses and pins match the attendee app.
const VENUES = {

  "Ocean Cliff": {addr:"65 Ridge Rd, Newport, RI 02840", ll:[41.46438,-71.35756]},

};
const WF_POSTS = Object.fromEntries(Object.entries(VENUES).map(([k,v])=>[k, v.ll]));   // destinations for pings and directions
const PRESETS = ["Need you at {post} now","Running 10 min late","Break relief needed","All clear"];

const views = {

};

// Gate check-in codes. Must match tix.gates in the staff server (seeded 2026-10-09) and the attendee app's parser.
const GATES_WF = [
  {code:"WINTERFEST-CHECKIN:ENTRY:1", name:"Event entry", pin:"1201"},
  {code:"WINTERFEST-CHECKIN:IGLOO:1", name:"Igloos at The Reef", pin:"1203"}

const gateList = () => (LIVE.gates && LIVE.gates.length ? LIVE.gates : GATES_WF).filter(g=>!/:RINK:/.test(g.code));   // no ice rink (2026-10-26)
function gateQRSheet(){
  openSheet("Gate check-in code", `<p class="sub">Guests open their tickets and scan this code to check themselves in. Post it at the gate (print it) or hold this screen up.</p>

    <div class="btns" style="justify-content:flex-end"><button class="btn" type="button" data-close="1">Done</button></div>`);
  drawGateQR();
}
function drawGateQR(){ const sel = $("#gqArea"), box = $("#gqBox"); if(!box || !sel) return; box.innerHTML = "";
  const g = gateList().find(x=>x.code===sel.value) || gateList()[0], text = g.code;
  if(window.QRCode){ try{ new QRCode(box, {text, width:220, height:220, colorDark:"#0B1E3F", colorLight:"#ffffff", correctLevel: QRCode.CorrectLevel.M}); }catch(e){ box.textContent = "QR unavailable"; } } else box.textContent = "QR library didn't load";

function render(){

  $("#whoTxt").textContent = isLive() ? (LIVE.me.name || LIVE.me.email).split(" ")[0] + " \u00b7 " + LIVE.me.role : "Sign in";
  const lp = $("#livePill"); if(lp){ lp.textContent = isLive() ? "LIVE" : "SIGNED OUT"; lp.classList.toggle("on", isLive()); }
  document.querySelectorAll(".tabs button").forEach(b=>{ if(b.dataset.tab===state.tab) b.setAttribute("aria-current","page"); else b.removeAttribute("aria-current"); });
  const unacked = isLive() ? LIVE.anns.filter(a=>!LIVE.acked.has(a.id) && a.created_by!==myId()).length : 0;
  $("#alertDot").hidden = !unacked;
  $("#alertDot").textContent = unacked;
  $("#main").innerHTML = views[state.tab]();
  const sv = document.getElementById("scanVid"); if(sv && scanStream && sv.srcObject!==scanStream){ sv.srcObject = scanStream; sv.play().catch(()=>{}); }
  const f = document.getElementById("composeForm"); if(f) f.addEventListener("submit", sendMsg);
  const m = document.getElementById("msgs"); if(m) m.lastElementChild?.scrollIntoView({block:"nearest"});
  if(state.tab!=="scan") stopScan();
  if(state.tab==="map") initStaffMap(); else if(smap){ smap.remove(); smap = null; }
}
function go(t){ state.tab = t; store.set("st.tab",t); render(); window.scrollTo(0,0); }
function now(){ const d=new Date(); return String(d.getHours()).padStart(2,"0")+":"+String(d.getMinutes()).padStart(2,"0"); }
function sendMsg(ev){
  ev.preventDefault(); const i = $("#msgIn"); const txt = i.value.trim(); if(!txt) return;
  if(isLive()) return liveSend(txt);
}
let tt=null; function toast(m){ const t=$("#toast"); t.textContent=m; t.hidden=false; clearTimeout(tt); tt=setTimeout(()=>t.hidden=true,2600); }
let lastFocus=null;
function openSheet(title, html){ lastFocus=document.activeElement; $("#sheetTitle").textContent=title; $("#sheetBody").innerHTML=html; $("#scrim").hidden=false; const f=$("#sheetBody button, #sheetBody select"); if(f) f.focus(); }
function closeSheet(){ $("#scrim").hidden=true; if(lastFocus&&lastFocus.focus) lastFocus.focus(); }


function bgSnow(){

    already_used: {cls:"used", title:"ALREADY USED", line1: ser, line2: "This ticket was already scanned in. Check ID or send the guest to the box office."},
    wrong_session: {cls:"used", title:"WRONG SESSION", line1: ser + (who ? " · " + who : ""), line2: "Not valid at this time. Check the session time on the ticket."},
    not_valid: {cls:"bad", title:"NOT VALID", line1: ser || "Unknown code", line2: "Not a valid Winterfest ticket (refunded, removed or not ours). Send the guest to the box office."}
  };
  state.verdict = V[r.result] || V.not_valid;
  try{ if(navigator.vibrate) navigator.vibrate(r.result==="valid" ? 80 : [200,80,200]); }catch(e){}
}
async function liveCheck(raw){
  const txt = String(raw||"").trim(); if(!txt) return;
  const full = /^WINTERFEST-TICKET:[^:\s]+:[^:\s]+$/i.test(txt), serial = full ? txt.split(":")[1].toUpperCase() : serialFrom(txt);
  state.scans++;
  if(!full && !can("staff")){ state.verdict = {cls:"bad", title:"SCAN THE QR", line1:serial, line2:"Checking by typed number needs a staff or lead login. Scan the QR on the guest's phone, or call a lead."}; render(); return; }
  const at = new Date().toISOString();
  try{
    const r = full ? await SB.rpc("tix","scan",{p_app:APP, p_qr:txt, p_gate:LIVE.gate, p_device:DEVICE})
                   : await SB.rpc("tix","scan_serial",{p_app:APP, p_serial:serial, p_gate:LIVE.gate, p_device:DEVICE});
    setVerdict(r, serial); LIVE.log.unshift({serial:r.serial || serial, result:r.result, t:now()});
    render(); refreshCounts(); if(LIVE.queue.length) flushQueue();
  }catch(e){
    if(full && isNetErr(e)){
      LIVE.queue.push({qr:txt, gate:LIVE.gate, at}); store.set("wfst.scanq", LIVE.queue);
      LIVE.log.unshift({serial, result:"queued", t:now()});
      state.verdict = {cls:"used", title:"SAVED - NO SIGNAL", line1:serial, line2:"Can't reach the ticket server. The scan is saved and checks when signal returns. Follow the gate's no-signal rule."};
    } else state.verdict = {cls:"bad", title:"CHECK FAILED", line1:serial, line2:e.message};
    render();
  }
}
let flushing = false;
async function flushQueue(){
  if(flushing || !isLive() || !LIVE.queue.length) return; flushing = true;
  try{
    while(LIVE.queue.length){
      const q = LIVE.queue[0];
      try{ const r = await SB.rpc("tix","scan",{p_app:APP, p_qr:q.qr, p_gate:q.gate, p_device:DEVICE, p_scanned_at:q.at});
        LIVE.log.unshift({serial:r.serial || q.qr.split(":")[1], result:r.result, t:hhmm(q.at), synced:true});
        if(r.result!=="valid") toast(`Offline scan ${r.serial || ""} came back ${RESULT_LABEL[r.result] || r.result}`);
      }catch(e){ if(isNetErr(e)) break; LIVE.log.unshift({serial:q.qr.split(":")[1] || "?", result:"not_valid", t:hhmm(q.at), synced:true}); }
      LIVE.queue.shift(); store.set("wfst.scanq", LIVE.queue);
    }
  } finally { flushing = false; refreshCounts(); if(state.tab==="scan") render(); }
}

  const groups = {}; LIVE.members.filter(m=>m.active).forEach(m=>{ const k = m.team || "Not on a team yet"; (groups[k] = groups[k] || []).push(m); });
  const keys = Object.keys(groups).sort((a,b)=>a==="Not on a team yet" ? 1 : b==="Not on a team yet" ? -1 : a.localeCompare(b));
  return `<div class="view">
    <div style="display:flex;justify-content:space-between;align-items:center;gap:10px;flex-wrap:wrap"><h2>Staff roster</h2><div class="btns">${can("admin") ? `<button class="btn" type="button" data-admin="roster">Manage roster</button>` : ""}<button class="btn ghost" type="button" data-roster="1">Planning CSV</button></div></div>
    <div class="sub">${LIVE.members.filter(m=>m.active).length} people signed up. Everyone joins as a volunteer with their work email; an admin sets teams and roles.</div>
    ${keys.map(k=>{ const t = TEAMS[teamKey(k)] || {c:"#888"}; return `<section class="panel" style="padding:12px;display:flex;flex-direction:column;gap:8px;border-top:5px solid ${k==="Not on a team yet" ? "#555" : t.c}"><div style="display:flex;justify-content:space-between;align-items:center"><h2 style="font-size:17px">${esc(k)}</h2><span class="sub">${groups[k].length}</span></div>
      <div class="list">${groups[k].map(m=>`<div class="item" style="grid-template-columns:auto minmax(0,1fr) auto"><div class="av" style="--c:${t.c}">${esc((m.name || m.email).split(/\s+/).map(w=>w[0]).join("").slice(0,2).toUpperCase())}</div><div><div class="ti">${esc(m.name || m.email)}${m.user_id===myId() ? " (you)" : ""}</div><div class="sub">${esc(m.role)} · ${esc(m.email)}</div></div>${m.user_id!==myId() ? `<button class="btn ghost" type="button" data-pingto="${m.user_id}" style="padding:6px 10px">Ping</button>` : ""}</div>`).join("")}</div></section>`; }).join("")}
  </div>`;
}

// ---------- Admin panel (role admin; override actions also need can_override - the database checks both)
function admTypes(id){ return LIVE.sellable.map(t=>`<option value="${t.id}"${t.id===id?" selected":""}>${esc(t.event)} · ${esc(t.name)}</option>`).join(""); }
function admPrice(){}
function adminSheet(tab){
  if(!can("admin")){ toast("Admins only"); return; }
  LIVE.adm = tab || LIVE.adm || "comp";
  const T2 = {comp:"Comps", apply:"Apply tickets", find:"Find tickets", report:"Report", roster:"Roster"};
  openSheet("Admin panel", `<div class="admtabs" role="group" aria-label="Admin sections">${Object.entries(T2).map(([k,v])=>`<button type="button" data-admin="${k}" aria-pressed="${k===LIVE.adm}">${v}</button>`).join("")}</div><div id="admBody">${admBody()}</div>
    <div class="btns" style="justify-content:flex-end"><button class="btn ghost" type="button" data-close="1">Close</button></div>`);
  if(LIVE.adm==="report") loadReport(); if(LIVE.adm==="roster") loadRoster();
}
function admBody(){
  const ov = !!LIVE.me.can_override, noTypes = !LIVE.sellable.length ? `<div class="notice">No ticket types exist yet for Winterfest.</div>` : "";
  if(LIVE.adm==="comp") return `${noTypes}<p class="sub">Comp tickets come as serialized QR codes. The guest scans one once with the Winter Festival app and it locks to that phone. Every comp is logged with who issued it and why.</p>
    <div class="field"><label class="label" for="admType">Ticket</label><select id="admType">${admTypes()}</select></div>
    <div style="display:flex;gap:8px"><div class="field" style="width:100px"><label class="label" for="admQty">How many</label><input id="admQty" type="number" min="1" max="50" value="1"></div><div class="field" style="flex:1"><label class="label" for="admWho">For</label><input id="admWho" placeholder="Name or company"></div></div>
    <div class="field"><label class="label" for="admEmail">Their email</label><input id="admEmail" type="email" placeholder="Optional - loads when they sign in with it"></div>
    <div class="field"><label class="label" for="admWhy">Reason (required)</label><input id="admWhy" placeholder="e.g. Sponsor hospitality, vendor staff, make-good" maxlength="200"></div>
    <button class="btn" type="button" data-admgo="comp">Issue comps</button>`;
  if(LIVE.adm==="apply") return ov ? `${noTypes}<p class="sub">Put tickets straight onto a guest's account by email, no QR needed. If they already use the app they're on the phone now; otherwise they load when the guest signs in with that email. Logged with your reason.</p>
    <div class="field"><label class="label" for="admType">Ticket</label><select id="admType">${admTypes()}</select></div>
    <div style="display:flex;gap:8px"><div class="field" style="width:100px"><label class="label" for="admQty">How many</label><input id="admQty" type="number" min="1" max="50" value="1"></div><div class="field" style="flex:1"><label class="label" for="admHolder">Name on tickets</label><input id="admHolder" placeholder="Optional"></div></div>
    <div class="field"><label class="label" for="admEmail">Guest email (required)</label><input id="admEmail" type="email"></div>
    <div class="field"><label class="label" for="admWhy">Reason (required)</label><input id="admWhy" placeholder="e.g. Failed purchase, family moved to a later show" maxlength="200"></div>
    <button class="btn" type="button" data-admgo="apply">Apply tickets</button>`
    : `<div class="notice">Applying tickets is an override. Your login doesn't have override rights; ask Michael or Katelyn.</div>`;
  if(LIVE.adm==="find") return `<div style="display:flex;gap:8px"><input id="admQ" placeholder="Email or ticket number" style="flex:1;min-width:0;border:1px solid var(--line);background:var(--panel-2);border-radius:10px;padding:9px 10px" value="${esc(LIVE.findQ||"")}"><button class="btn" type="button" data-admgo="find">Search</button></div>
    ${LIVE.act ? admActForm() : ""}
    <div class="list">${LIVE.found.map(t=>`<div class="rrow"><div><div class="ti">${esc(t.serial)} · ${esc(t.event || "")} · ${esc(t.type || "")}</div><div class="sub">${esc(t.status)}${t.is_comp ? " · comp" : ""} · ${t.owner_email ? "on " + esc(t.owner_email) + "'s phone" : t.waiting_for ? "waiting for " + esc(t.waiting_for) : "not loaded"}${t.buyer_email ? " · bought by " + esc(t.buyer_email) : ""} · ${t.came_in ? "came in" : "not scanned in"}</div></div>
      ${t.status==="void" || t.status==="refunded" ? "" : `<div class="ctl">${ov ? `<button class="btn ghost" type="button" data-admact="${t.id}|move" style="padding:5px 9px">Move</button><button class="btn ghost" type="button" data-admact="${t.id}|unlock_phone" style="padding:5px 9px">New phone</button><button class="btn ghost" type="button" data-admact="${t.id}|remove" style="padding:5px 9px">Remove</button>` : ""}<button class="btn ghost" type="button" data-admact="${t.id}|refund" style="padding:5px 9px">Refund</button></div>`}</div>`).join("") || `<div class="rrow"><div class="sub">${LIVE.findQ ? "Nothing found." : "Search by the guest's email or a ticket number (3 or more characters)."}</div></div>`}</div>`;
  if(LIVE.adm==="report") return `<p class="sub">Every comp and override: who issued it, why, and whether the person actually came in.</p><div class="list" id="admReport">${LIVE.report.map(r=>`<div class="rrow"><div class="ti">${esc(r.kind)} · ${esc(r.serial || "")} · ${r.came_in ? "came in" : "not in yet"}</div><div class="sub">${new Date(r.created_at).toLocaleString("en-US",{month:"short",day:"numeric",hour:"numeric",minute:"2-digit"})} · by ${esc(nameOf(r.by_user))}${r.recipient ? " · for " + esc(r.recipient) : ""} · ${esc(r.status || "")}</div><div class="sub">Reason: ${esc(r.reason)}</div></div>`).join("") || `<div class="rrow"><div class="sub">No comps or overrides yet.</div></div>`}</div>`;
  if(LIVE.adm==="roster") return `<p class="sub">Everyone who signs in with a work email joins as a volunteer. Set their team and role here. Override rights let an admin apply, move and remove tickets.</p>
    <div class="list">${LIVE.members.map(m=>`<div class="rrow"><div><div class="ti">${esc(m.name || m.email)}${m.user_id===myId() ? " (you)" : ""}</div><div class="sub">${esc(m.email)}</div></div>
      <div class="ctl"><select aria-label="Role" data-rf="role" data-uid="${m.user_id}">${["volunteer","staff","lead","admin"].map(r=>`<option${r===m.role?" selected":""}>${r}</option>`).join("")}</select>
      <input type="text" aria-label="Team" data-rf="team" data-uid="${m.user_id}" value="${esc(m.team || "")}" placeholder="Team" list="teamNames" style="width:150px">
      <label class="sub"><input type="checkbox" data-rf="active" data-uid="${m.user_id}"${m.active?" checked":""}> active</label>
      ${LIVE.me.can_override ? `<label class="sub"><input type="checkbox" data-rf="can_override" data-uid="${m.user_id}"${m.can_override?" checked":""}> override</label>` : ""}
      <button class="btn ghost" type="button" data-rsave="${m.user_id}" style="padding:5px 10px">Save</button></div></div>`).join("")}</div>
    <datalist id="teamNames">${Object.values(TEAMS).map(t=>`<option value="${esc(t.name)}">`).join("")}</datalist>`;
  return "";
}
function admActForm(){
  const a = LIVE.act, t = LIVE.found.find(x=>x.id===a.id) || {}, L = {move:"Move to another ticket type", unlock_phone:"Unlock for a new phone (issues a fresh claim QR)", remove:"Remove this ticket (stops scanning)", refund:"Refund (stops scanning; card refunds process once payments are live)"};
  return `<div class="mini"><div class="ti">${esc(L[a.action])} · ${esc(t.serial || "")}</div>
    ${a.action==="move" ? `<div class="field"><label class="label" for="actType">New ticket type</label><select id="actType">${admTypes()}</select></div>` : ""}
    <div class="field"><label class="label" for="actWhy">Reason (required)</label><input id="actWhy" maxlength="200"></div>
    <div class="btns"><button class="btn ghost" type="button" data-admactgo="cancel">Cancel</button><button class="btn${a.action==="remove"||a.action==="refund"?" danger":""}" type="button" data-admactgo="go">Confirm</button></div></div>`;
}
function admRedraw(){ const b = $("#admBody"); if(b) b.innerHTML = admBody(); }
async function loadReport(){ try{ LIVE.report = await SB.select("tix","comp_report", q=>q.eq("app",APP).order("created_at",{ascending:false}).limit(150)); }catch(e){ toast(e.message); } if(LIVE.adm==="report") admRedraw(); }
async function loadRoster(){ try{ LIVE.members = await SB.select("staff","members", q=>q.eq("app",APP).order("name")); }catch(e){ toast(e.message); } if(LIVE.adm==="roster") admRedraw(); }
async function admGo(kind, btn){
  const why = ($("#admWhy") || {}).value, email = (($("#admEmail") || {}).value || "").trim();
  try{
    btn.disabled = true;
    if(kind==="comp"){
      if(!why || why.trim().length < 3){ toast("Add a reason"); return; }
      const r = await SB.rpc("tix","issue_comp",{p_app:APP, p_ticket_type_id:$("#admType").value, p_qty:Math.max(1, +$("#admQty").value || 1), p_reason:why.trim(), p_recipient:$("#admWho").value.trim() || null, p_email:email || null});
      showClaims(r.tickets || [], "Comp tickets", email);
    } else if(kind==="apply"){
      if(!/^[^@\s]+@[^@\s]+\.[^@\s]+$/.test(email)){ toast("Enter the guest's email"); return; }
      if(!why || why.trim().length < 3){ toast("Add a reason"); return; }
      const r = await SB.rpc("tix","admin_apply",{p_app:APP, p_ticket_type_id:$("#admType").value, p_qty:Math.max(1, +$("#admQty").value || 1), p_target_email:email, p_reason:why.trim(), p_holder:$("#admHolder").value.trim() || null});
      toast(r.on_phone_now ? `${(r.tickets||[]).length} ticket(s) are on ${email}'s phone now` : `${(r.tickets||[]).length} ticket(s) will load when ${email} signs in`);
      if(!r.on_phone_now) showClaims(r.tickets || [], "Applied tickets", email);
    } else if(kind==="find"){
      LIVE.findQ = $("#admQ").value.trim(); LIVE.act = null;
      if(LIVE.findQ.length < 3){ toast("Type at least 3 characters"); return; }
      LIVE.found = await SB.rpc("tix","find_tickets",{p_app:APP, p_q:LIVE.findQ}) || []; admRedraw();
    }
  }catch(e){ toast(e.message); }
  finally{ btn.disabled = false; }
}
async function admActGo(){
  const a = LIVE.act, why = ($("#actWhy").value || "").trim(); if(why.length < 3){ toast("Add a reason"); return; }
  try{
    let t;
    if(a.action==="refund") t = await SB.rpc("tix","refund_ticket",{p_ticket_id:a.id, p_reason:why});
    else t = await SB.rpc("tix","admin_change",{p_ticket_id:a.id, p_action:a.action, p_reason:why, p_new_ticket_type_id: a.action==="move" ? $("#actType").value : null});
    LIVE.act = null; toast({move:"Moved", unlock_phone:"Unlocked - show them the new QR", remove:"Removed", refund:"Refunded - it no longer scans"}[a.action]);
    if(a.action==="unlock_phone" && t && t.claim_token){ showClaims([t], "New phone", t.reserved_email); return; }
    LIVE.found = await SB.rpc("tix","find_tickets",{p_app:APP, p_q:LIVE.findQ}) || []; admRedraw();
  }catch(e){ toast(e.message); }
}
async function rosterSave(uid){
  const f = k => document.querySelector(`[data-rf="${k}"][data-uid="${uid}"]`);
  const patch = {role:f("role").value, team:f("team").value.trim() || null, active:f("active").checked};
  if(f("can_override")) patch.can_override = f("can_override").checked;
  try{ await SB.update("staff","members",{user_id:uid, app:APP}, patch); toast("Saved"); await loadRoster();
    if(uid===myId()){ const m = member(uid); if(m) Object.assign(LIVE.me, {role:m.role, team:m.team, can_override:m.can_override}); render(); } }
  catch(e){ toast(e.message); }
}

// Live-only buttons
document.addEventListener("click", ev=>{
  const t = ev.target.closest("button"); if(!t) return; const ds = t.dataset;
  if(ds.signin){ closeSheet(); setGateMode("signin"); showGate(true); return; }
  if(!isLive()) return;
  if(ds.syncq){ flushQueue(); return; }
  if(ds.doorsell){ liveDoorSell(t); return; }
  if(ds.doorqr){ showClaims([LIVE.door[+ds.doorqr]], "Door ticket"); return; }
  if(ds.claimnav){ const c = LIVE.claim; c.i = Math.max(0, Math.min(c.list.length-1, c.i + (+ds.claimnav))); drawClaim(); return; }
  if(ds.lsendping){ liveSendPing(); return; }
  if(ds.lsenddir!==undefined && t.matches("[data-lsenddir]")){ liveSendDir(ds.lsenddir); return; }
  if(ds.lping){ const [id, act] = ds.lping.split("|"); livePingAction(id, act); return; }
  if(ds.pingto){ livePingSheet(); const s = $("#pTo"); if(s) s.value = "user:" + ds.pingto; return; }
  if(ds.admin){ if($("#admBody") && !$("#scrim").hidden){ LIVE.adm = ds.admin; LIVE.act = null; document.querySelectorAll("[data-admin]").forEach(b=>b.setAttribute("aria-pressed", b.dataset.admin===LIVE.adm)); admRedraw(); if(LIVE.adm==="report") loadReport(); if(LIVE.adm==="roster") loadRoster(); } else adminSheet(ds.admin); return; }
  if(ds.admgo){ admGo(ds.admgo, t); return; }
  if(ds.admact){ const [id, action] = ds.admact.split("|"); LIVE.act = {id, action}; admRedraw(); const w = $("#actWhy"); if(w) w.focus(); return; }
  if(ds.admactgo){ if(ds.admactgo==="cancel"){ LIVE.act = null; admRedraw(); } else admActGo(); return; }
  if(ds.rsave){ rosterSave(ds.rsave); return; }
});

document.addEventListener("click", ev=>{
  const t = ev.target.closest("button"); if(!t) return; const ds = t.dataset;
  if(ds.gateqr){ gateQRSheet(); return; }
  if(ds.tab){ if(ds.tab==="pings"){ const d = $("#pingDot"); if(d) d.hidden = true; } go(ds.tab); return; }
  if(ds.newping){ pingSheet(); return; }
  if(ds.help){ sendHelp(); return; }
  if(ds.helpack){ $("#pingBanner").hidden = true; toast("Acknowledged. They can see you're on it."); return; }
  if(ds.scanstart){ startScan(); return; }
  if(ds.scanstop){ stopScan(); return; }
  if(ds.scanman){ checkTicket($("#manSer").value); return; }
  if(ds.doorissue){ doorSheet(); return; }
  if(ds.newdir){ dirSheet(null); return; }
  if(ds.pickpoint){ closeSheet(); state.dirPick = true; go("map"); toast("Tap the map where they should go"); return; }
  if(ds.distance){ const ll = ds.distance.split(",").map(Number); if(!navigator.geolocation){ $("#dDist").textContent = "Location isn't available on this device."; return; } navigator.geolocation.getCurrentPosition(p=>{ const m = meters([p.coords.latitude,p.coords.longitude], ll); $("#dDist").textContent = `Distance: ${m<1000 ? Math.round(m)+" m" : (m/1000).toFixed(1)+" km"} (about ${Math.max(1,Math.round(m/80))} min walk)`; }, ()=>{ $("#dDist").textContent = "Location permission was declined."; }); return; }
  if(ds.signout){ signOut(); return; }
  if(ds.placepin){ placing = !placing; t.textContent = placing ? "Tap the map to place\u2026" : "Place pin"; if(placing){ toast("Zoom in, then tap where it goes"); document.getElementById("smap").scrollIntoView({behavior:"smooth", block:"center"}); } return; }
  if(ds.savepin){ const ll = ds.savepin.split(",").map(Number); const label = (document.getElementById("pinLabel").value||"").trim() || "Pin"; PINS.push({ll, label, type:document.getElementById("pinType").value, t:now(), by:isLive() ? (LIVE.me.name || LIVE.me.email) : "You"}); savePins(); closeSheet(); drawPins(); toast("Pin saved on this phone."); return; }
  if(ds.delpin){ PINS.splice(Number(ds.delpin),1); savePins(); if(smap) smap.closePopup(); drawPins(); toast("Pin removed"); return; }
  if(ds.chan){ state.chan = ds.chan; render(); return; }
  if(ds.shareloc && isLive()){ liveShareLoc(); return; }
  if(ds.ack && isLive()){ LIVE.acked.add(+ds.ack); store.set("wfst.annAck", [...LIVE.acked]); toast("Acknowledged"); render(); return; }
  if(ds.compose){ if(!needLive()) return; if(!can("lead")){ toast("Leads and Ops send alerts"); return; } openSheet("Send alert", `<div class="field"><label class="label" for="aTo">Send to</label><select id="aTo"><option>All staff</option>${Object.values(TEAMS).map(x=>`<option>${esc(x.name)}</option>`).join("")}${Object.keys(VENUES).map(k=>`<option>Everyone at ${esc(k)}</option>`).join("")}</select></div>
      <div class="field"><label class="label" for="aLvl">Priority</label><select id="aLvl"><option value="info">Info</option><option value="urgent">Urgent</option></select></div>
      <div class="field"><label class="label" for="aTxt">Message</label><textarea id="aTxt" rows="3" placeholder="Where to be, when, and what to do"></textarea></div>
      <div class="btns" style="justify-content:flex-end"><button class="btn ghost" type="button" data-close="1">Cancel</button><button class="btn" type="button" data-sendalert="1">Send</button></div>`); return; }
  if(ds.sendalert && isLive()){ const txt = $("#aTxt").value.trim(); if(!txt){ toast("Write the alert first"); return; } liveAnnounce($("#aTo").value, txt, $("#aLvl").value==="urgent" ? "urgent" : "normal"); return; }
  if(ds.close){ closeSheet(); return; }
  if(t.id==="whoBtn" && isLive()){ liveAccountSheet(); return; }
  if(t.id==="whoBtn"){ openSheet("Account", `<p class="sub">You're signed out. Sign in with your work email for chat, pings, alerts, the roster and ticket scanning.</p><button class="btn" type="button" data-signin="1">Sign in with your work email</button>`); return; }
});
document.addEventListener("keydown", ev=>{ if(ev.key==="Escape" && !$("#scrim").hidden) closeSheet(); });
$("#scrim").addEventListener("click", ev=>{ if(ev.target.id==="scrim") closeSheet(); });
if(!views[state.tab]) state.tab="shift";
$("#gateForm").addEventListener("submit", gateSubmit);
$("#gShow").addEventListener("change", ev=>{ $("#gPass").type = ev.target.checked ? "text" : "password"; });
$("#gForgot").addEventListener("click", ()=>{ $("#gErr").textContent = "Ask an admin or Ops to reset your password."; });
$("#gMode").addEventListener("click", ()=>setGateMode(gateMode==="create" ? "signin" : "create"));
$("#gLater").addEventListener("click", ()=>{ showGate(false); render(); });
bgSnow();
// STAFF_LOCK true: nothing shows until the staff server confirms a work login. False: the app opens signed out and each tab offers sign-in.
showGate(STAFF_LOCK);
render();
liveBoot();
})();
</script>
