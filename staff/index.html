<style>
/* Layout: the Winterfest night-palace staff tool - midnight base, ice accents, Cinzel headers, tabs along the TOP (unlike the Concours staff app), big tap targets, team colour as the main signal. Single dark theme. */
:root{
  --bg:#0B1E3F; --panel:#11284F; --panel-2:#173563; --fg:#F4FAFD; --muted:#B9C8DE; --line:#24427a;
  --gold:#A8D8EA; --urgent:#e0533f; --ok:#3fae6b; --info:#5aa8e8;
  --display:"Cinzel", "Trajan Pro", Georgia, serif;
  --body:"Nunito Sans", system-ui, -apple-system, "Segoe UI", sans-serif;
  --mono:"IBM Plex Mono", ui-monospace, Consolas, monospace;
  color-scheme:dark;
}
*{box-sizing:border-box}
html,body{height:100%}
body{background:var(--bg);color:var(--fg);font-family:var(--body);font-size:15px;line-height:1.45;margin:0}
.app{max-width:480px;margin:0 auto;min-height:100%;display:flex;flex-direction:column}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer}
a{color:inherit}
:focus-visible{outline:2px solid var(--gold);outline-offset:2px}
.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:5;background:#081733;color:#eef1f6;padding:12px 16px;border-bottom:3px solid var(--team,#c9a14a)}
.row1{display:flex;justify-content:space-between;align-items:center;gap:10px}
.brand{font-family:var(--display);font-weight:700;font-size:22px;letter-spacing:.04em;text-transform:uppercase}
.brand small{display:block;font-family:var(--body);font-size:11px;font-weight:700;letter-spacing:.16em;color:#7fc4e8}
.who{display:flex;align-items:center;gap:8px;border:1px solid #2c3f63;border-radius:999px;padding:5px 10px 5px 6px;background:transparent;color:#eef1f6;font-size:13px;font-weight:600}
.sw{width:14px;height:14px;border-radius:4px;background:var(--team,#c9a14a);flex:0 0 auto}
main{flex:1;padding:16px 16px calc(28px + env(safe-area-inset-bottom,0px))}
.view{display:flex;flex-direction:column;gap:16px}
h1,h2{font-family:var(--display);font-weight:700;margin:0;letter-spacing:.02em;text-transform:uppercase;text-wrap:balance}
h1{font-size:30px;line-height:1.05}
h2{font-size:20px}
.label{font-size:11px;font-weight:700;letter-spacing:.14em;text-transform:uppercase;color:var(--muted)}
.notice{font-size:12.5px;color:var(--muted);border:1px dashed var(--line);border-radius:10px;padding:8px 10px}
.panel{background:var(--panel);border:1px solid var(--line);border-radius:14px}
.now{padding:16px;display:flex;flex-direction:column;gap:10px;border-left:6px solid var(--team)}
.now .where{font-family:var(--display);font-size:34px;font-weight:700;line-height:1;text-transform:uppercase}
.now .when{font-family:var(--mono);font-size:15px}
.now .task{color:var(--muted)}
.kv{display:flex;flex-wrap:wrap;gap:6px 14px;font-size:13px}
.kv b{font-weight:700}
.btns{display:flex;gap:8px;flex-wrap:wrap}
.btn{border:0;border-radius:10px;padding:10px 14px;font-weight:700;background:var(--gold);color:#16120a}
.btn.ghost{background:transparent;border:1px solid var(--line);color:var(--fg)}
.btn.ok{background:var(--ok);color:#fff}
.btn.danger{background:var(--urgent);color:#fff}
.list{background:var(--panel);border:1px solid var(--line);border-radius:14px;overflow:hidden}
.item{display:grid;grid-template-columns:62px minmax(0,1fr) auto;gap:10px;padding:12px;border-top:1px solid var(--line);align-items:center}
.item:first-child{border-top:0}
.t{font-family:var(--mono);font-size:13px}
.t span{display:block;color:var(--muted);font-size:11px}
.ti{font-weight:700;line-height:1.25}
.sub{font-size:12.5px;color:var(--muted)}
.pill{font-size:11px;font-weight:800;letter-spacing:.06em;text-transform:uppercase;border-radius:999px;padding:3px 8px;white-space:nowrap}
.days{display:flex;gap:6px;overflow-x:auto;scrollbar-width:none}
.days button{flex:0 0 auto;border:1px solid var(--line);background:var(--panel);border-radius:10px;padding:6px 12px;font-weight:700;font-size:13px}
.days button[aria-pressed="true"]{background:var(--gold);border-color:var(--gold);color:#16120a}
.teams{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}
.team{background:var(--panel);border:1px solid var(--line);border-top:5px solid var(--c);border-radius:12px;padding:12px;text-align:left;display:flex;flex-direction:column;gap:4px;min-width:0}
.team .n{font-family:var(--display);font-size:19px;font-weight:700;text-transform:uppercase;line-height:1.05}
.team[aria-pressed="true"]{box-shadow:0 0 0 2px var(--c)}
.roster .item{grid-template-columns:auto minmax(0,1fr) auto}
.av{width:34px;height:34px;border-radius:50%;display:grid;place-items:center;font-weight:800;font-size:13px;color:#0c1524;background:var(--c)}
.chan{display:flex;gap:6px;overflow-x:auto;scrollbar-width:none}
.chan button{flex:0 0 auto;border:1px solid var(--line);background:var(--panel);border-radius:999px;padding:6px 12px;font-size:13px;font-weight:600;display:flex;align-items:center;gap:6px}
.chan button[aria-pressed="true"]{border-color:var(--gold);color:var(--gold)}
.msgs{display:flex;flex-direction:column;gap:10px;min-height:280px}
.msg{max-width:84%;display:flex;flex-direction:column;gap:3px}
.msg .bub{background:var(--panel);border:1px solid var(--line);border-radius:14px 14px 14px 4px;padding:9px 12px}
.msg.me{align-self:flex-end}
.msg.me .bub{background:var(--gold);color:#16120a;border-color:var(--gold);border-radius:14px 14px 4px 14px}
.msg .by{font-size:11.5px;color:var(--muted);display:flex;gap:6px;align-items:center}
.msg.me .by{justify-content:flex-end}
.msg.loc .bub{border-left:4px solid var(--info)}
.compose{position:sticky;bottom:calc(10px + env(safe-area-inset-bottom,0px));display:flex;gap:8px;background:var(--bg);padding-top:8px}
.compose input{flex:1;min-width:0;border:1px solid var(--line);background:var(--panel);border-radius:12px;padding:10px 12px}
.mapbox{background:var(--panel);border:1px solid var(--line);border-radius:14px;overflow:hidden}
.mapbox svg{display:block;width:100%;height:auto}
.alert{display:grid;grid-template-columns:6px minmax(0,1fr);gap:12px;padding:12px;border-top:1px solid var(--line)}
.alert:first-child{border-top:0}
.alert .bar{border-radius:4px;background:var(--info)}
.alert.urgent .bar{background:var(--urgent)}
.alert.done{opacity:.55}
.field{display:flex;flex-direction:column;gap:4px}
.field select,.field input,.field textarea{border:1px solid var(--line);background:var(--panel-2);border-radius:10px;padding:9px 10px}
.tabs{position:static;background:transparent;padding:10px 0 0;margin:0 -8px}
.tabs nav{display:grid;grid-template-columns:repeat(7,1fr);gap:2px}
.tabs button{position:relative;background:none;border:0;color:#8c99b3;display:flex;flex-direction:column;align-items:center;gap:3px;font-size:10.5px;font-weight:700;letter-spacing:.04em;text-transform:uppercase;padding:4px 2px}
.tabs button svg{width:22px;height:22px}
.scanbox{position:relative;border-radius:16px;overflow:hidden;background:#06122a;aspect-ratio:1/1;max-width:100%}
.scanbox video{width:100%;height:100%;object-fit:cover;display:block}
.scanbox .frame{position:absolute;inset:18%;border:3px solid #5EE6C8;border-radius:16px;box-shadow:0 0 0 999px rgba(6,18,42,.35)}
.verdict{border-radius:16px;padding:16px;display:flex;flex-direction:column;gap:4px;font-weight:700}
.verdict b{font-size:26px;letter-spacing:.06em}
.verdict.ok{background:#1f7a52;color:#fff}.verdict.used{background:#d8a32a;color:#1a1300}.verdict.bad{background:#b23a48;color:#fff}
.help{background:linear-gradient(135deg,#b23a48,#e0533f);color:#fff;border:0;border-radius:14px;padding:14px;font-weight:800;font-size:16px;width:100%}
.ro{border:1px dashed var(--line);border-radius:12px;padding:10px;font-size:13.5px;color:var(--muted)}
.tabs button[aria-current="page"]{color:#0B1E3F;background:#A8D8EA;border-radius:10px}
.dotc{position:absolute;top:0;right:22%;background:var(--urgent);color:#fff;border-radius:999px;font-size:10px;min-width:16px;height:16px;display:grid;place-items:center;padding:0 4px}
.scrim{position:fixed;inset:0;background:rgba(0,0,0,.6);z-index:9;display:flex;align-items:flex-end;justify-content:center}
.sheet{background:var(--panel);width:100%;max-width:480px;max-height:88%;overflow-y:auto;border-radius:18px 18px 0 0;padding:18px 18px calc(22px + env(safe-area-inset-bottom,0px));display:flex;flex-direction:column;gap:12px}
.toast{position:fixed;left:50%;top:calc(150px + env(safe-area-inset-top,0px));transform:translateX(-50%);background:#081733;color:#eef1f6;border:1px solid var(--gold);border-radius:999px;padding:9px 16px;font-size:13.5px;font-weight:600;z-index:10;max-width:calc(100% - 32px)}
#bgsnow{position:fixed;inset:0;width:100vw;height:100vh;z-index:0;pointer-events:none}
.app{position:relative;z-index:1}
#gate{position:fixed;inset:0;z-index:30;background:radial-gradient(90% 50% at 80% 0%,rgba(94,230,200,.18),transparent 60%),#0B1E3F;display:flex;align-items:center;justify-content:center;padding:24px 16px}
#gate .box{width:100%;max-width:400px;background:rgba(17,40,79,.92);border:1px solid var(--line);border-radius:22px;padding:22px;display:flex;flex-direction:column;gap:12px}
#gate h1{font-family:var(--display);font-size:24px;margin:0;letter-spacing:.08em}
#gate input[type=email],#gate input[type=password],#gate input[type=text]{border:1px solid var(--line);background:#0B1E3F;color:var(--fg);border-radius:12px;padding:12px;width:100%}
.err{color:#ffb3a8;font-weight:700;font-size:13.5px;min-height:18px}
.linkbtn{background:none;border:0;padding:0;color:#A8D8EA;font-weight:700;text-decoration:underline;align-self:flex-start}
#pingBanner{position:fixed;left:50%;transform:translateX(-50%);top:calc(10px + env(safe-area-inset-top,0px));z-index:25;width:min(460px,calc(100% - 20px));background:linear-gradient(135deg,#2A6F97,#6b55c9);color:#fff;border-radius:18px;padding:14px;box-shadow:0 10px 30px rgba(0,0,0,.5);display:flex;flex-direction:column;gap:8px}
#pingBanner b{font-size:16px}
.acks{display:flex;gap:6px;flex-wrap:wrap}
.ackp{font-size:11.5px;font-weight:800;border-radius:999px;padding:3px 9px;background:var(--panel-2);color:var(--muted)}
.ackp.ok{background:var(--ok);color:#fff}
.dirmk{width:30px;height:30px;border-radius:50%;background:#5EE6C8;border:3px solid #0B1E3F;box-shadow:0 0 0 6px rgba(94,230,200,.35)}
@media (prefers-reduced-motion: reduce){ *{transition:none!important;animation:none!important} }
</style>
<style>.gqbox{align-self:center;background:#fff;padding:14px;border-radius:16px;width:248px;height:248px}.gqbox img,.gqbox canvas{width:220px!important;height:220px!important}.gqcode{font-family:var(--mono);text-align:center;font-size:15px;letter-spacing:.06em}</style>

<div id="gate" hidden>

</div>
<div id="pingBanner" hidden role="alertdialog" aria-live="assertive"></div>
<div class="app">
  <header class="top">
    <div class="row1">
      <div class="brand" style="display:flex;align-items:center;gap:10px"><img src="logo-header.png" alt="Newport Winter Festival" style="height:36px;width:auto;border-radius:8px;background:#fff;padding:2px 5px"><span>Staff</span></div>
      <button class="who" type="button" id="whoBtn"><span class="sw"></span><span id="whoTxt">Gates</span></button>
    </div>
  <div class="tabs"><nav aria-label="Staff sections">
    <button type="button" data-tab="shift" aria-current="page"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9"><circle cx="12" cy="12" r="8.5"/><path d="M12 7v5l3 2"/></svg>My shift</button>
    <button type="button" data-tab="chat"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9"><path d="M4 5h16v11H9l-5 4z"/></svg>Chat<span class="dotc" id="chatDot">4</span></button>
    <button type="button" data-tab="pings"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9"><path d="M12 3v3M12 18v3M3 12h3M18 12h3"/><circle cx="12" cy="12" r="4"/></svg>Pings<span class="dotc" id="pingDot" hidden>1</span></button>
    <button type="button" data-tab="scan"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9"><path d="M4 8V5a1 1 0 0 1 1-1h3M16 4h3a1 1 0 0 1 1 1v3M20 16v3a1 1 0 0 1-1 1h-3M8 20H5a1 1 0 0 1-1-1v-3M4 12h16"/></svg>Scan</button>
    <button type="button" data-tab="map"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9"><path d="M12 21s-7-6.2-7-11.5A7 7 0 0 1 19 9.5C19 14.8 12 21 12 21z"/><circle cx="12" cy="9.5" r="2.5"/></svg>Posts</button>
    <button type="button" data-tab="team"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9"><circle cx="9" cy="8" r="3.5"/><path d="M2.5 20a6.5 6.5 0 0 1 13 0"/><circle cx="17" cy="9" r="2.5"/><path d="M16 14.5a5 5 0 0 1 6 5"/></svg>Teams</button>
    <button type="button" data-tab="alerts"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9"><path d="M6 16V11a6 6 0 0 1 12 0v5l1.5 2h-15z"/><path d="M10 20a2 2 0 0 0 4 0"/></svg>Alerts<span class="dotc" id="alertDot">2</span></button>
  </nav></div>
  </header>
  <main id="main"></main>
</div>
<div class="scrim" id="scrim" hidden><div class="sheet" role="dialog" aria-modal="true" aria-labelledby="sheetTitle"><h2 id="sheetTitle"></h2><div id="sheetBody" style="display:flex;flex-direction:column;gap:12px"></div></div></div>
<div class="toast" id="toast" role="status" hidden></div>

<script>
(function(){
// Work-email domains allowed into the staff app. CONFIRM WITH MICHAEL before launch.
// STAFF_LOCK: false = open (Michael 2026-10-09: "unlock them, we can lock it up later"). Set true to require work email + password again.
const STAFF_LOCK = false;
const STAFF_DOMAINS = ["audrainautomuseum.org","audrainconcours.com","mwmwealth.com"];
// Demo only: real auth needs a backend (identity service or Microsoft 365 / Entra sign-in). This page checks format, not a real password.
const GATE_KEY = "wfst.session";
// Sample staffing plan built on the real 2026 Week at a Glance. Teams, posts and people are illustrative.
const TEAMS = {
  ops:       {name:"Operations Desk", short:"Ops", c:"#7fc4e8", lead:"Ops Lead", radio:"Ch 1", base:null, size:0},
  guest:     {name:"Guest Services", short:"Guest", c:"#f0b48f", lead:"Guest Services Lead", radio:"Ch 2", base:null, size:0},
  venues:    {name:"Venue Teams", short:"Venues", c:"#9fd39a", lead:"Venue Lead", radio:"Ch 3", base:null, size:0},
  volunteer: {name:"Volunteers", short:"Volunteers", c:"#d1a6f0", lead:"Volunteer Coordinator", radio:"Ch 4", base:null, size:0}
};
const POSTS = {};

// Guest transport for the demo day (Sat Oct 3), from audrainconcours.com/parking-transportation.
const GUEST = {lots:[], stops:[], loop:""};
// Shifts per team per day: [day, start, end, post, task, event]
const SHIFTS = {};
const ROSTER_ROLES = ["Lead","Deputy lead","Staff","Staff","Staff","Staff","Volunteer","Volunteer"];
const SAMPLE_NAMES = ["Sample Lead","Sample Deputy","Staff A","Staff B","Staff C","Staff D","Volunteer A","Volunteer B"];
const CHANNELS = {
  ann:   {name:"Announcements", note:"Read-only: leads and Ops post, everyone reads", ro:true},
  all:   {name:"All staff", note:"Everyone can post"},
  team:  {name:"My team", note:""},
  leads: {name:"Leads", note:"Team leads and Ops"},
  ops:   {name:"Ops Desk", note:"Direct line to dispatch"}
};
const SEED = {
  ann: [{by:"Ops Lead", team:"ops", t:"08:45", txt:"Read-only channel. Only leads and Ops post here, so nothing important gets buried."}],
  all: [{by:"Ops Lead", team:"ops", t:"09:00", txt:"Welcome to the Winterfest staff app. Shifts, posts and teams will load here once the event plan is set."}],
  team: [], leads: [], ops: [{by:"Ops Desk", team:"ops", t:"09:00", txt:"Questions or issues on site? Message here."}]
};
const ALERTS0 = [
  {id:1, lvl:"info", t:"09:00", to:"All staff", txt:"Staff app is set up. You'll get alerts here for where to be, schedule changes and urgent calls.", ack:false}
];

const store = { get(k,f){ try{ const v=localStorage.getItem(k); return v?JSON.parse(v):f; }catch(e){ return f; } }, set(k,v){ try{ localStorage.setItem(k,JSON.stringify(v)); }catch(e){} } };
const state = {
  tab: store.get("st.tab","shift"), team: store.get("st.team","ops"), day:"2026-10-03",
  chan:"team", msgs: store.get("st.msgs", SEED), alerts: store.get("st.alerts", ALERTS0),
  checkin: store.get("st.checkin", {}), viewTeam:null, chatSeen:false,
  pings: store.get("wfst.pings", []), dirs: store.get("wfst.dirs", []), dirPick:false, myLL:null,
  lead: store.get("wfst.lead", false), redeemed: store.get("wfst.redeemed", {}), door: store.get("wfst.door", []), scans:0, verdict:null, roster: store.get("wfst.roster", [])
};
// SAMPLE recipients and posts for pings and directions until the real roster and site plan exist.
const PEOPLE = ["Ops Lead","Guest Services Lead","Venue Lead","Volunteer Coordinator","Staff A","Staff B","Volunteer A"];
const WF_POSTS = {"W1 Welcome Lodge":[41.4842,-71.3122], "R1 Skate Rentals":[41.4836,-71.3116], "N3 Hot Cocoa Bar":[41.4848,-71.3119], "E9 Chowder Shack":[41.4839,-71.3104]};
const PRESETS = ["Need you at {post} now","Running 10 min late","Break relief needed","All clear"];
const $ = s => document.querySelector(s);
const esc = s => String(s).replace(/[&<>"']/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const fmt = t => { const [h,m]=t.split(":").map(Number); return ((h%12)||12)+":"+String(m).padStart(2,"0")+((h>=12&&h<24)?" PM":" AM"); };
const dname = d => new Date(d+"T12:00:00").toLocaleDateString("en-US",{weekday:"short",month:"short",day:"numeric"});
const T = () => TEAMS[state.team];
const myShifts = () => (SHIFTS[state.team]||[]);
const DAYS = () => [...new Set(myShifts().map(s=>s[0]))];
// Demo clock: pretend it is Saturday 10:15 during the event so "now" and "next" read correctly.
const DEMO_NOW = {d:"2026-10-03", t:"10:15"};
const mins = t => { const [h,m]=t.split(":").map(Number); return h*60+m; };
function nowNext(){
  const list = myShifts().filter(s=>s[0]===DEMO_NOW.d);
  const n = mins(DEMO_NOW.t);
  const cur = list.find(s=>mins(s[1])<=n && n<mins(s[2]));
  const nxt = list.find(s=>mins(s[1])>n);
  return {cur: cur || list[0] || myShifts()[0], nxt};
}

const views = {
  scan(){
    const v = state.verdict, todayDoor = state.door.slice(0,8);
    return `<div class="view">
      <div style="display:flex;justify-content:space-between;align-items:center;gap:10px"><h2>Scan tickets</h2><span class="pill" style="background:var(--panel-2)">${state.scans} scanned this shift</span></div>
      ${v ? `<div class="verdict ${v.cls}" role="status"><b>${v.title}</b><span>${esc(v.line1)}</span><span style="font-weight:600;opacity:.9">${esc(v.line2||"")}</span></div>` : `<div class="sub">Point the camera at a guest's ticket QR. Green = admit, amber = already used, red = not valid.</div>`}
      <div class="scanbox" id="scanBox"><video id="scanVid" playsinline muted></video><div class="frame"></div></div>
      <div class="btns"><button class="btn" type="button" data-scanstart="1">Start camera</button><button class="btn ghost" type="button" data-scanstop="1">Stop</button><button class="btn ghost" type="button" data-scandemo="1">Demo: simulate a scan</button></div>
      <div class="field"><label class="label" for="manSer">Can't scan? Type the ticket number</label><div style="display:flex;gap:8px"><input id="manSer" placeholder="WF-ABCDE-1" autocapitalize="characters" style="flex:1"><button class="btn" type="button" data-scanman="1">Check</button></div></div>
      <section style="display:flex;flex-direction:column;gap:8px"><div style="display:flex;justify-content:space-between;align-items:center"><h2>Door tickets</h2><button class="btn ghost" type="button" data-doorissue="1">Issue door ticket</button></div>
        <div class="list">${todayDoor.length ? todayDoor.map(d=>`<div class="item" style="grid-template-columns:minmax(0,1fr)"><div><div class="ti">${esc(d.name)} \u00b7 ${esc(d.type)}</div><div class="sub">${esc(d.serial)} \u00b7 Issued at door ${d.t} by ${esc(d.by)}</div></div></div>`).join("") : `<div class="item"><div class="sub">For guests handed entry at the door. Issued tickets count in attendance.</div></div>`}</div></section>
      <section style="display:flex;flex-direction:column;gap:8px"><h2>Redemption log</h2>
        <div class="list">${Object.entries(state.redeemed).slice(-8).reverse().map(([ser,r])=>`<div class="item" style="grid-template-columns:minmax(0,1fr)"><div><div class="ti">${esc(ser)}</div><div class="sub">${r.t} \u00b7 ${esc(r.by)}${r.door?" \u00b7 door":""}</div></div></div>`).join("") || `<div class="item"><div class="sub">No tickets redeemed yet.</div></div>`}</div></section>
      <div class="notice">Demo: the redemption log lives on this phone. Live, every scanner checks the same ticket server so a ticket can't be used twice at different gates.</div>
    </div>`;
  },
  pings(){
    const inc = state.dirs.filter(d=>d.incoming);
    return `<div class="view">
      <button class="help" type="button" data-help="1">I need help here</button>
      <div class="btns"><button class="btn" type="button" data-newping="1">Send a ping</button><button class="btn ghost" type="button" data-newdir="1">Send directions</button><button class="btn ghost" type="button" data-simping="1">Demo: receive a ping</button><button class="btn ghost" type="button" data-gateqr="1">Gate check-in code</button></div>
      <section style="display:flex;flex-direction:column;gap:10px"><h2>Pings</h2>
        <div class="list">${state.pings.length ? state.pings.map(p=>`<div class="item" style="grid-template-columns:minmax(0,1fr)"><div><div class="sub">${p.t} \u00b7 to ${esc(p.to.join(", "))}${p.incoming?" \u00b7 received":""}</div><div class="ti">${esc(p.msg)}</div><div class="acks" style="margin-top:6px">${p.to.map(r=>`<span class="ackp${p.acks[r]?" ok":""}">${esc(r)}: ${esc(p.acks[r]||"sent")}</span>`).join("")}</div></div></div>`).join("") : `<div class="item" style="grid-template-columns:minmax(0,1fr)"><div class="sub">No pings yet. Ping a person, a team or everyone at a post.</div></div>`}</div></section>
      <section style="display:flex;flex-direction:column;gap:10px"><h2>Directions</h2>
        <div class="list">${state.dirs.length ? state.dirs.map((d,i)=>`<div class="item" style="grid-template-columns:minmax(0,1fr) auto"><div><div class="sub">${d.t} \u00b7 ${d.incoming?"from "+esc(d.from):"to "+esc(d.to)}</div><div class="ti">${esc(d.label)}</div>${d.note?`<div class="sub">${esc(d.note)}</div>`:""}</div><button class="btn ghost" type="button" data-opendir="${i}" style="padding:7px 10px">Open</button></div>`).join("") : `<div class="item" style="grid-template-columns:minmax(0,1fr)"><div class="sub">Send someone directions to a post or a point you drop on the map.</div></div>`}</div></section>
      <div class="notice">Demo: pings, replies and directions stay on this phone. Real delivery and push notifications need the staff backend.</div>
    </div>`;
  },
  shift(){
    const {cur, nxt} = nowNext(); const tm = T();
    if(!state.day || !DAYS().includes(state.day)) state.day = DAYS().includes(DEMO_NOW.d) ? DEMO_NOW.d : DAYS()[0];
    const key = cur ? cur.join("|") : ""; const done = state.checkin[key];
    const p = cur ? POSTS[cur[3]] : null;
    return `<div class="view">
      <div class="notice">Winterfest staff app. Your shifts, posts and team appear here once the event plan is published.</div>
      <button class="btn" type="button" data-gateqr="1" style="align-self:flex-start">Show gate check-in code</button>
      ${cur ? `<section class="panel now">
        <div class="label">Be here now</div>
        <div class="where">${esc(p.name)}</div>
        <div class="when">${fmt(cur[1])} to ${fmt(cur[2])} · ${dname(cur[0])}</div>
        <div class="task">${esc(cur[4])}${cur[5] ? " · " + esc(cur[5]) : ""}</div>

function bgSnow(){
  const c = document.getElementById("bgsnow"); if(!c) return; const x = c.getContext("2d"); const reduce = matchMedia("(prefers-reduced-motion: reduce)").matches;
  let W = 0, H = 0, fl = [], raf = null;
  function size(){ const dpr = Math.min(devicePixelRatio||1, 2); W = innerWidth; H = innerHeight; c.width = W*dpr; c.height = H*dpr; x.setTransform(dpr,0,0,dpr,0,0); const n = W < 600 ? 40 : 60; while(fl.length < n) fl.push(mk(true)); fl.length = n; draw(); }
  function mk(any){ return {x:Math.random()*W, y:any?Math.random()*H:-5, r:0.6+Math.random()*1.4, v:0.2+Math.random()*0.45, p:Math.random()*6.28}; }
  function draw(){ x.clearRect(0,0,W,H); x.fillStyle = "rgba(244,250,253,.38)"; fl.forEach(f=>{ x.beginPath(); x.arc(f.x,f.y,f.r,0,6.283); x.fill(); }); }
  function step(){ fl.forEach(f=>{ f.y += f.v; f.p += .01; f.x += Math.sin(f.p)*.25; if(f.y > H+5) Object.assign(f, mk(false)); }); draw(); raf = requestAnimationFrame(step); }
  size(); addEventListener("resize", size); if(reduce) return;
  document.addEventListener("visibilitychange", ()=>{ if(document.hidden){ cancelAnimationFrame(raf); raf = null; } else if(!raf) raf = requestAnimationFrame(step); });
  raf = requestAnimationFrame(step); window.__staffSnow = ()=>fl.reduce((a,f)=>a+f.y,0);
}

async function startScan(){
  const v = document.getElementById("scanVid"); if(!v) return;
  if(!navigator.mediaDevices || !navigator.mediaDevices.getUserMedia){ toast("Camera isn't available here. Type the ticket number."); return; }
  try{ scanStream = await navigator.mediaDevices.getUserMedia({video:{facingMode:"environment"}}); }catch(e){ toast("Camera permission was declined. Type the ticket number."); return; }
  v.srcObject = scanStream; await v.play().catch(()=>{});
  const det = ("BarcodeDetector" in window) ? new BarcodeDetector({formats:["qr_code"]}) : null; if(!det) await loadJsQR();
  const c = document.createElement("canvas"), x = c.getContext("2d", {willReadFrequently:true}); let last = "", lastAt = 0;
  scanTimer = setInterval(async ()=>{ if(!v.videoWidth) return; let txt = null;
    try{ if(det){ const r = await det.detect(v); if(r[0]) txt = r[0].rawValue; } else if(window.jsQR){ c.width = v.videoWidth; c.height = v.videoHeight; x.drawImage(v,0,0); const img = x.getImageData(0,0,c.width,c.height); const r = window.jsQR(img.data, c.width, c.height); if(r) txt = r.data; } }catch(e){}
    if(txt && (txt!==last || Date.now()-lastAt > 3000)){ last = txt; lastAt = Date.now(); checkTicket(txt); } }, 350);
}
function serialFrom(raw){ const t = String(raw||"").trim(); let m = t.match(/^(?:WINTERFEST-TICKET|WFT):(.+)$/i); return (m ? m[1] : t).toUpperCase(); }

  const r = state.redeemed[ser];
  if(r){ state.verdict = {cls:"used", title:"ALREADY USED", line1:ser, line2:`Scanned ${r.t} by ${r.by}. Check ID or send to the box office.`}; render(); return; }
  state.redeemed[ser] = {t:now(), by:T().short}; store.set("wfst.redeemed", state.redeemed);
  state.verdict = {cls:"ok", title:"VALID - ADMIT", line1:door ? `${door.name} \u00b7 ${door.type}` : "Winterfest ticket", line2:ser}; render();
}

  openSheet("Send a ping", `<div class="field"><label class="label" for="pTo">To</label><select id="pTo">${recipients()}</select></div>
    <div class="field"><label class="label" for="pPre">Message</label><select id="pPre">${PRESETS.map((p,i)=>`<option value="${i}">${esc(p.replace("{post}","a post"))}</option>`).join("")}<option value="custom">Custom\u2026</option></select></div>
    <div class="field"><label class="label" for="pPost">Post (for "Need you at")</label><select id="pPost">${Object.keys(WF_POSTS).map(k=>`<option>${esc(k)}</option>`).join("")}</select></div>
    <div class="field"><label class="label" for="pTxt">Custom message</label><input id="pTxt" placeholder="Optional"></div>
    <div class="btns" style="justify-content:flex-end"><button class="btn ghost" type="button" data-close="1">Cancel</button><button class="btn" type="button" data-sendping="1">Send ping</button></div>`);
}
function sendPing(){
  const to = expand($("#pTo").value), pre = $("#pPre").value, custom = $("#pTxt").value.trim();
  const msg = pre==="custom" ? (custom || "Ping") : PRESETS[+pre].replace("{post}", $("#pPost").value);
  const p = {id:Date.now(), t:now(), to, msg, acks:{}}; state.pings.unshift(p); store.set("wfst.pings", state.pings); closeSheet(); toast("Ping sent"); render();
  // Demo: simulate acknowledgements arriving a couple of seconds later.
  to.forEach((r,i)=>setTimeout(()=>{ const q = state.pings.find(x=>x.id===p.id); if(!q) return; q.acks[r] = ["On my way","Done","On my way"][i%3]; store.set("wfst.pings", state.pings); if(state.tab==="pings") render(); }, 1600 + i*700));
}
function incomingPing(msg, from){
  const b = $("#pingBanner"); try{ if(navigator.vibrate) navigator.vibrate([200,100,200]); }catch(e){}
  const id = Date.now(); state.pings.unshift({id, t:now(), to:["You"], msg:`${from}: ${msg}`, acks:{}, incoming:true}); store.set("wfst.pings", state.pings);
  b.innerHTML = `<div style="font-size:11px;font-weight:800;letter-spacing:.2em">PING FROM ${esc(from.toUpperCase())}</div><b>${esc(msg)}</b><div class="btns">${["On my way","Can't","Done"].map(r=>`<button class="btn" type="button" data-pingreply="${id}|${r}" style="background:#fff;color:#1F4E79;padding:8px 12px">${r}</button>`).join("")}</div>`;
  b.hidden = false; const d = $("#pingDot"); if(d) d.hidden = false;
}
function dirSheet(ll, label){
  openSheet("Send directions", `<div class="field"><label class="label" for="dDest">Destination</label><select id="dDest">${ll?`<option value="pt">${esc(label||"Point dropped on the map")}</option>`:""}${Object.keys(WF_POSTS).map(k=>`<option>${esc(k)}</option>`).join("")}</select></div>
    ${ll?"":`<button class="btn ghost" type="button" data-pickpoint="1">Drop a point on the map instead</button>`}
    <div class="field"><label class="label" for="dTo">To</label><select id="dTo">${recipients()}</select></div>
    <div class="field"><label class="label" for="dNote">Note</label><input id="dNote" placeholder="e.g. Use the side gate by the rink"></div>
    <div class="btns" style="justify-content:flex-end"><button class="btn ghost" type="button" data-close="1">Cancel</button><button class="btn" type="button" data-senddir="${ll?ll.join(","):""}">Send</button></div>`);
}
function sendDir(llStr){
  const dest = $("#dDest").value, ll = dest==="pt" ? llStr.split(",").map(Number) : WF_POSTS[dest], label = dest==="pt" ? "Dropped point" : dest;
  const to = $("#dTo").selectedOptions[0].textContent, note = $("#dNote").value.trim();
  state.dirs.unshift({t:now(), to, label, note, ll}); state.dirs.unshift({t:now(), from:"You (demo copy as received)", label, note, ll, incoming:true});
  store.set("wfst.dirs", state.dirs); closeSheet(); toast("Directions sent"); render();
}
let dirMarker = null;
function openDir(i){
  const d = state.dirs[i]; go("map");
  setTimeout(()=>{ if(!smap) return; if(dirMarker) smap.removeLayer(dirMarker);
    dirMarker = L.marker(d.ll, {icon:L.divIcon({className:"", html:'<div class="dirmk"></div>', iconSize:[30,30]})}).addTo(smap);
    smap.flyTo(d.ll, 18, {duration:.6});
    const walk = `https://www.google.com/maps/dir/?api=1&destination=${d.ll[0]},${d.ll[1]}&travelmode=walking`;
    openSheet(d.label, `${d.note?`<p>${esc(d.note)}</p>`:""}<div class="sub" id="dDist">Distance: allow location to see it.</div>
      <a class="btn" style="text-align:center;text-decoration:none" href="${walk}" target="_blank" rel="noopener">Walk there</a>
      <button class="btn ghost" type="button" data-distance="${d.ll.join(",")}">Show distance from me</button>
      <div class="btns" style="justify-content:flex-end"><button class="btn ghost" type="button" data-close="1">Close</button></div>`);
  }, 200);
}
function meters(a, b){ const R = 6371000, r = x=>x*Math.PI/180, dl = r(b[0]-a[0]), dg = r(b[1]-a[1]); const h = Math.sin(dl/2)**2 + Math.cos(r(a[0]))*Math.cos(r(b[0]))*Math.sin(dg/2)**2; return 2*R*Math.asin(Math.sqrt(h)); }

let smap = null, guestLayer = null, placing = false, pinLayer = null;
const PIN_TYPES = {post:["Post","#4a90d9"], meet:["Meeting point","#3fae6b"], hazard:["Hazard / closed","#e0533f"], vehicle:["Vehicle / cart","#c9a14a"], note:["Note","#9aa7bf"]};
let PINS = (()=>{ try{ return JSON.parse(localStorage.getItem("st.pins")||"[]"); }catch(e){ return []; } })();
const savePins = () => { try{ localStorage.setItem("st.pins", JSON.stringify(PINS)); }catch(e){} };
function drawPins(){
  if(!smap) return; if(pinLayer) smap.removeLayer(pinLayer); pinLayer = L.layerGroup().addTo(smap);
  PINS.forEach((p,i)=>{ const ty = PIN_TYPES[p.type]||PIN_TYPES.note;
    L.marker(p.ll, {icon:L.divIcon({className:"", html:`<div class="pm" style="width:22px;height:22px;border-radius:6px;background:${ty[1]};color:#fff;border-color:#fff">+</div>`, iconSize:null})})
      .bindPopup(`<b>${esc(p.label)}</b><br>${ty[0]} \u00b7 placed ${esc(p.t)} by ${esc(p.by)}<br><button type="button" data-delpin="${i}" style="margin-top:6px">Remove</button>`).addTo(pinLayer); });
}
function postColor(k){ const t = Object.entries(TEAMS).find(([tk,t])=>t.base===k) || Object.entries(TEAMS).find(([tk])=>(SHIFTS[tk]||[]).some(x=>x[3]===k)); return t ? t[1].c : "#8c99b3"; }
function initStaffMap(){
  const el = document.getElementById("smap"); if(!el) return;
  if(!window.L){ el.innerHTML = '<p class="sub" style="padding:16px">The map could not load. Check your connection.</p>'; return; }
  if(smap){ smap.remove(); smap = null; }
  smap = L.map(el, {scrollWheelZoom:false}); smap.attributionControl.setPrefix('<a href="https://leafletjs.com">Leaflet</a>');
  L.tileLayer("https://tile.openstreetmap.org/{z}/{x}/{y}.png", {maxZoom:19, maxNativeZoom:19, attribution:'&copy; <a href="https://www.openstreetmap.org/copyright">OpenStreetMap</a> contributors'}).addTo(smap);
  const mine = new Set(myShifts().map(x=>x[3]));
  Object.entries(POSTS).forEach(([k,p])=>{
    const c = postColor(k), m = mine.has(k);
    const icon = L.divIcon({className:"", html:`<div class="pm${m?" mine":""}" style="width:26px;height:26px;background:${c}">${esc(p.name.split(" ").map(w=>w[0]).join("").slice(0,2))}</div>`, iconSize:null});
    L.marker(p.ll, {icon, title:p.name}).bindTooltip(p.name, {direction:"top", offset:[0,-14]}).on("click", ()=>showPost(k)).addTo(smap);
  });
  guestLayer = L.layerGroup();
  GUEST.lots.forEach(l=>L.marker(l.ll, {icon:L.divIcon({className:"", html:'<div class="pm guest" style="width:24px;height:24px">P</div>', iconSize:null})}).bindPopup(`<b>Guest parking: ${esc(l.name)}</b><br>${l.hours} \u00b7 free, first come`).addTo(guestLayer));
  GUEST.stops.forEach(st=>L.marker(st.ll, {icon:L.divIcon({className:"", html:'<div class="pm stop">T</div>', iconSize:null})}).bindPopup(`<b>Trolley stop: ${esc(st.name)}</b><br>${esc(GUEST.loop)}`).addTo(guestLayer));
  L.polyline(GUEST.stops.map(x=>x.ll), {color:"#b8913a", weight:3, dashArray:"8 6", opacity:.85}).addTo(guestLayer);
  if(state.guest!==false) guestLayer.addTo(smap);
  drawPins();
  smap.on("click", ev=>{ if(state.dirPick){ state.dirPick = false; dirSheet([+ev.latlng.lat.toFixed(6), +ev.latlng.lng.toFixed(6)], "Point dropped on the map"); return; } if(!placing) return; placing = false; const b = document.getElementById("placeBtn"); if(b) b.textContent = "Place pin";
    const ll = [Number(ev.latlng.lat.toFixed(6)), Number(ev.latlng.lng.toFixed(6))];
    openSheet("New pin", `<div class="field"><label class="label" for="pinLabel">Name</label><input id="pinLabel" placeholder="e.g. Water station 2"></div>
      <div class="field"><label class="label" for="pinType">Type</label><select id="pinType">${Object.entries(PIN_TYPES).map(([k,v])=>`<option value="${k}">${v[0]}</option>`).join("")}</select></div>
      <div class="sub">${ll[0]}, ${ll[1]}</div>
      <div class="btns" style="justify-content:flex-end"><button class="btn ghost" type="button" data-close="1">Cancel</button><button class="btn" type="button" data-savepin="${ll.join(",")}">Save pin</button></div>`); });
  zoomTo(mine.size && [...mine].every(k=>POSTS[k].sample) ? "fort" : "all");
  setTimeout(()=>smap && smap.invalidateSize(), 60);
}
function zoomTo(which){
  if(!smap) return;
  if(!Object.keys(POSTS).length && !GUEST.stops.length){ smap.setView([41.4835,-71.3125], 14); return; }
  const pts = Object.values(POSTS).filter(p=> which==="all" ? true : which==="fort" ? p.sample : !p.sample).map(p=>p.ll);
  if(which==="all") GUEST.stops.forEach(x=>pts.push(x.ll));
  smap.fitBounds(L.latLngBounds(pts).pad(which==="fort" ? 0.25 : 0.15));
}

function showPost(k){
  const p = POSTS[k]; const teams = Object.entries(TEAMS).filter(([tk,t])=>t.base===k || (SHIFTS[tk]||[]).some(s=>s[3]===k));
  const mine = myShifts().filter(s=>s[3]===k);
  const html = `<div class="sub">${esc(p.where)}</div>
    <div class="label">Teams at this post</div>
    <div class="btns">${teams.map(([tk,t])=>`<span class="pill" style="background:${t.c};color:#0c1524">${esc(t.short)}</span>`).join("") || `<span class="sub">None assigned</span>`}</div>
    ${mine.length ? `<div class="label">You are here</div><div class="list">${mine.map(s=>`<div class="item" style="grid-template-columns:auto minmax(0,1fr)"><div class="t">${fmt(s[1])}</div><div><div class="ti">${dname(s[0])}</div><div class="sub">${esc(s[4])}</div></div></div>`).join("")}</div>` : ""}
    ${p.sample ? `<div class="sub">Sample placement inside Fort Adams.</div>` : ""}<a class="btn ghost" style="text-align:center;text-decoration:none" href="https://maps.google.com/?q=${p.ll[0]},${p.ll[1]}" target="_blank" rel="noopener">Directions</a>
    <div class="btns" style="justify-content:flex-end"><button class="btn" type="button" data-close="1">Done</button></div>`;
  openSheet(p.name, html);
}

document.addEventListener("click", ev=>{
  const t = ev.target.closest("button"); if(!t) return; const ds = t.dataset;
  if(ds.gateqr){ gateQRSheet(); return; }
  if(ds.tab){ if(ds.tab==="pings"){ const d = $("#pingDot"); if(d) d.hidden = true; } go(ds.tab); return; }
  if(ds.newping){ pingSheet(); return; }
  if(ds.help){ sendHelp(); return; }
  if(ds.helpgo){ $("#pingBanner").hidden = true; openDir(+ds.helpgo); return; }
  if(ds.helpack){ $("#pingBanner").hidden = true; toast("Acknowledged. They can see you're on it."); return; }
  if(ds.leadtoggle){ state.lead = !state.lead; store.set("wfst.lead", state.lead); toast(state.lead ? "Posting as a lead (demo)" : "Posting as staff"); render(); return; }
  if(ds.scanstart){ startScan(); return; }
  if(ds.scanstop){ stopScan(); return; }
  if(ds.scandemo){ const known = Object.keys(state.redeemed); checkTicket(known.length && Math.random()<.5 ? "WINTERFEST-TICKET:" + known[known.length-1] : "WINTERFEST-TICKET:WF-DEMO" + String.fromCharCode(65 + Math.floor(Math.random()*26)) + "-1"); return; }
  if(ds.scanman){ checkTicket($("#manSer").value); return; }
  if(ds.doorissue){ doorSheet(); return; }
  if(ds.doorgo){ issueDoor(); return; }
  if(ds.roster){ rosterSheet(); return; }
  if(ds.rostergo){ importRoster(); return; }
  if(ds.sendping){ sendPing(); return; }
  if(ds.simping){ incomingPing("Need you at R1 Skate Rentals now", "Ops Lead"); return; }
  if(ds.pingreply){ const [id, r] = ds.pingreply.split("|"); const p = state.pings.find(x=>x.id==id); if(p){ p.acks["You"] = r; store.set("wfst.pings", state.pings); } $("#pingBanner").hidden = true; toast("Replied: " + r); if(state.tab==="pings") render(); return; }
  if(ds.newdir){ dirSheet(null); return; }
  if(ds.pickpoint){ closeSheet(); state.dirPick = true; go("map"); toast("Tap the map where they should go"); return; }
  if(ds.senddir!==undefined && t.matches("[data-senddir]")){ sendDir(ds.senddir); return; }
  if(ds.opendir){ openDir(+ds.opendir); return; }
  if(ds.distance){ const ll = ds.distance.split(",").map(Number); if(!navigator.geolocation){ $("#dDist").textContent = "Location isn't available on this device."; return; } navigator.geolocation.getCurrentPosition(p=>{ const m = meters([p.coords.latitude,p.coords.longitude], ll); $("#dDist").textContent = `Distance: ${m<1000 ? Math.round(m)+" m" : (m/1000).toFixed(1)+" km"} (about ${Math.max(1,Math.round(m/80))} min walk)`; }, ()=>{ $("#dDist").textContent = "Location permission was declined."; }); return; }
  if(ds.signout){ signOut(); return; }
  if(ds.day){ state.day = ds.day; render(); return; }
  if(ds.checkin){ const d=new Date(); state.checkin[ds.checkin] = d.toLocaleTimeString("en-US",{hour:"numeric",minute:"2-digit"}); store.set("st.checkin",state.checkin); toast("Checked in. Your lead can see you're at your post."); render(); return; }
  if(ds.showpost){ if(state.tab!=="map"){ go("map"); } showPost(ds.showpost); if(smap) smap.flyTo(POSTS[ds.showpost].ll, 17, {duration:.6}); return; }
  if(ds.flypost){ if(smap){ smap.flyTo(POSTS[ds.flypost].ll, 17, {duration:.6}); document.getElementById("smap").scrollIntoView({behavior:"smooth", block:"center"}); } return; }
  if(ds.zoom){ zoomTo(ds.zoom); return; }
  if(ds.placepin){ placing = !placing; t.textContent = placing ? "Tap the map to place\u2026" : "Place pin"; if(placing){ toast("Zoom in, then tap where it goes"); document.getElementById("smap").scrollIntoView({behavior:"smooth", block:"center"}); } return; }
  if(ds.savepin){ const ll = ds.savepin.split(",").map(Number); const label = (document.getElementById("pinLabel").value||"").trim() || "Pin"; PINS.push({ll, label, type:document.getElementById("pinType").value, t:now(), by:T().short}); savePins(); closeSheet(); drawPins(); toast("Pin placed. Everyone on staff sees it in the live app."); return; }
  if(ds.delpin){ PINS.splice(Number(ds.delpin),1); savePins(); if(smap) smap.closePopup(); drawPins(); toast("Pin removed"); return; }
  if(ds.chan){ state.chan = ds.chan; render(); return; }
  if(ds.shareloc){ const post = (nowNext().cur && POSTS[nowNext().cur[3]]) ? POSTS[nowNext().cur[3]].name : null;
    const push = txt => { (state.msgs[state.chan] = state.msgs[state.chan]||[]).push({by:"You", team:state.team, t:now(), txt, me:true, loc:true}); store.set("st.msgs",state.msgs); render(); };
    if(post){ push("Shared location: " + post); return; }
    if(navigator.geolocation){ navigator.geolocation.getCurrentPosition(p=>push(`Shared location: ${p.coords.latitude.toFixed(5)}, ${p.coords.longitude.toFixed(5)}`), ()=>push("Shared location (permission declined)")); } else push("Shared location"); return; }
  if(ds.viewteam){ state.viewTeam = state.viewTeam===ds.viewteam ? null : ds.viewteam; render(); return; }
  if(ds.dm){ state.chan = "ops"; go("chat"); toast("Direct messages open in Ops Desk for this demo"); return; }
  if(ds.ack){ const a = state.alerts.find(x=>x.id==ds.ack); a.ack = true; store.set("st.alerts",state.alerts); toast("Acknowledged. Ops can see you've got it."); render(); return; }
  if(ds.compose){ openSheet("Send alert", `<div class="field"><label class="label" for="aTo">Send to</label><select id="aTo"><option>All staff</option>${Object.values(TEAMS).map(x=>`<option>${esc(x.name)}</option>`).join("")}${Object.values(POSTS).map(p=>`<option>Everyone at ${esc(p.name)}</option>`).join("")}</select></div>
      <div class="field"><label class="label" for="aLvl">Priority</label><select id="aLvl"><option value="info">Info</option><option value="urgent">Urgent</option></select></div>
      <div class="field"><label class="label" for="aTxt">Message</label><textarea id="aTxt" rows="3" placeholder="Where to be, when, and what to do"></textarea></div>
      <div class="btns" style="justify-content:flex-end"><button class="btn ghost" type="button" data-close="1">Cancel</button><button class="btn" type="button" data-sendalert="1">Send</button></div>`); return; }
  if(ds.sendalert){ const txt = $("#aTxt").value.trim(); if(!txt){ toast("Write the alert first"); return; } state.alerts.unshift({id:Date.now(), lvl:$("#aLvl").value, t:now(), to:$("#aTo").value, txt, ack:false}); store.set("st.alerts",state.alerts); closeSheet(); toast("Alert sent"); render(); return; }
  if(ds.close){ closeSheet(); return; }
  if(t.id==="whoBtn"){ const ss = session(); openSheet("Account and team", `<p class="sub">Signed in as <b>${esc(ss ? ss.email : "")}</b>.</p><button class="btn ghost" type="button" data-signout="1">Sign out</button><button class="btn ghost" type="button" data-leadtoggle="1">${state.lead ? "Lead mode on (demo)" : "Turn on lead mode (demo)"}</button><p class="sub">Staff see their own team. For the demo, pick any team to see its shifts, posts and chat.</p><div class="teams">${Object.entries(TEAMS).map(([k,x])=>`<button type="button" class="team" style="--c:${x.c}" data-pickteam="${k}" aria-pressed="${k===state.team}"><span class="n">${esc(x.name)}</span><span class="sub">${x.radio}</span></button>`).join("")}</div>`); return; }
  if(ds.pickteam){ state.team = ds.pickteam; store.set("st.team",state.team); state.day=null; closeSheet(); toast("Now viewing as " + T().name); render(); return; }
});
document.addEventListener("keydown", ev=>{ if(ev.key==="Escape" && !$("#scrim").hidden) closeSheet(); if((ev.key==="Enter"||ev.key===" ") && ev.target.matches && ev.target.matches("g[data-showpost]")){ ev.preventDefault(); showPost(ev.target.dataset.showpost); } });
$("#scrim").addEventListener("click", ev=>{ if(ev.target.id==="scrim") closeSheet(); });
if(!views[state.tab]) state.tab="shift";
$("#gateForm").addEventListener("submit", gateSubmit);
$("#gShow").addEventListener("change", ev=>{ $("#gPass").type = ev.target.checked ? "text" : "password"; });
$("#gForgot").addEventListener("click", ()=>{ $("#gErr").textContent = "Contact Ops to reset your password."; });
Object.keys(TEAMS).forEach(k=>{ const n = state.roster.filter(p=>p.team===k).length; if(n) TEAMS[k].size = n; });
bgSnow();
if(STAFF_LOCK && !session()) showGate(true); else showGate(false);
render();
})();
</script>
<script>if('serviceWorker' in navigator){addEventListener('load',()=>navigator.serviceWorker.register('sw.js').catch(()=>{}));}</script>
</body>
